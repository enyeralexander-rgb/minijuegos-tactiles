<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Memoria Baby Finger</title>
<!--
  Maqueta de las dos memorias de Baby Finger (sprint B2): la misma mecánica en dos ambientes, «parque» y
  «bajo el mar» (D-033). Solo sirve para aprobar aspecto, sonido y sensación antes de construirlas en libGDX.

  Igual que la sopa: todo se dibuja en un solo lienzo con lo que tiene libGDX (imágenes o recortes de imagen,
  formas llenas, líneas, texto con borde, transparencia, giro y escala). Fondos, reversos y caras de las cartas se
  "hornean" una vez en imágenes aparte (en nativo, texturas); en cada cuadro solo se pegan, se giran y se escalan.
  El volteo es una escala horizontal que pasa por cero, con la carta levantada y su sombra más lejos a mitad de giro.
  Las reglas están en logica.js (se prueban con node pruebas.mjs).

  Parámetros: ?ambiente=parque o ?ambiente=mar, ?o=v o ?o=h fuerzan la orientación, ?semilla=123 repite las partidas,
  ?musica=0 quita la música, ?musica=sintetizada usa la base hecha por código, ?selector=0 esconde el selector de
  ambiente del inicio, ?depurar=1 activa teclas (1 encuentra una pareja, E error, G gana, P pierde, V salta la vista
  previa, A cambia de ambiente).
-->
<style>
@font-face{font-family:'Fredoka';src:url(fuentes/Fredoka-Bold.ttf) format('truetype');font-weight:700;font-display:block}
@font-face{font-family:'Fredoka';src:url(fuentes/Fredoka-SemiBold.ttf) format('truetype');font-weight:600;font-display:block}
html,body{margin:0;height:100%;overflow:hidden;background:#7cc8f2;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#lienzo{position:absolute;display:block;touch-action:none;cursor:pointer}
</style>
</head>
<body>
<canvas id="lienzo"></canvas>
<script src="logica.js"></script>
<script>
'use strict';
(() => {
const PARAMS = new URLSearchParams(location.search);
const EMB = window.__MEMORIA_EMB || null;           // en el archivo compartible todo viene incrustado
const recurso = n => (EMB && EMB[n]) ? EMB[n] : n;
const LG = window.MemoriaLogica;

/* ======================= Reglas y tiempos ======================= */
const PAREJAS = LG.PAREJAS, ERRORES_MAX = LG.ERRORES_MAX;
const VISTA = 5, INACTIVIDAD = 45, ABANDONO = 90, GUARDA_RESULTADO = 1.2;
const T_GIRO = .3;                                   // lo que tarda una carta en voltearse

/* Colores de la marca (los mismos de la sopa) */
const C = { rojo: '#DC1C26', rojoOsc: '#A0121A', azul: '#00348A', azulOsc: '#00225C', blanco: '#FFFFFF',
  tinta: '#0B2A66', gris: '#C5D0DF', oro: '#FFC93C', verde: '#22A356' };
const ELOGIOS = ['¡Muy bien!', '¡Genial!', '¡Excelente!', '¡Bien hecho!', '¡Súper!', '¡Lo tienes!', '¡Qué memoria!'];

/* Los dos ambientes: la misma mecánica, otro mundo (D-033) */
const AMBIENTES = {
  parque: { sub: 'en el parque', colorSub: '#1E7BE0', producto: 'panalPants', tinte: '#E6F5FD', sombraBebe: '#1F5A17', fondoPagina: '#7cc8f2' },
  mar: { sub: 'bajo el mar', colorSub: '#0E6FB8', producto: 'panalAcuatico', tinte: '#DDF6F6', sombraBebe: '#8A6A30', fondoPagina: '#2a9fd6' },
};
let AMB = PARAMS.get('ambiente') === 'mar' ? 'mar' : 'parque';
const SELECTOR = PARAMS.get('selector') !== '0';

/* ======================= Azar con semilla ======================= */
let semilla = PARAMS.has('semilla') ? Number(PARAMS.get('semilla')) >>> 0 : (Math.random() * 1e9) >>> 0;
const FIJA = PARAMS.has('semilla');   // con ?semilla las partidas se repiten en el mismo orden
const nuevaSemilla = () => { semilla = (semilla * 1103515245 + 12345 + (FIJA ? 0 : (Math.random() * 1e6) | 0)) >>> 0; return semilla; };
const mulberry32 = LG.mulberry32, barajar = LG.barajar;

/* ======================= Escenario fijo y orientación ======================= */
const lienzo = document.getElementById('lienzo'), ctx = lienzo.getContext('2d');
let O = 'v', W = 1080, H = 1920, escala = 1, px = 1;      // px: píxeles reales por unidad del escenario
function orientacionDeseada() { const f = PARAMS.get('o'); if (f === 'v' || f === 'h') return f; return innerHeight >= innerWidth ? 'v' : 'h'; }

/* Distribución (unidades de 1080p). Vertical: cartas, vidas y botones arriba; marca y bebé abajo (D-013).
   Horizontal: las cartas abajo y al centro, la marca arriba a la izquierda, el marcador a la derecha (D-014). */
const LAYOUTS = {
  v: { W: 1080, H: 1920, horizonte: 1500, arena: 1610,
    juego: { grilla: { x: 40, y: 196, w: 1000, gap: 20, ch: 270 },
      parejas: { x: 40, y: 40, w: 600, h: 116, filas: 1 }, vidas: { x: 664, y: 46, w: 376, h: 108 },
      cuenta: { x: 40, y: 38, w: 1000, h: 120 }, titulo: { x: 540, y: 1406, fs: 92 }, sub: { y: 1478, fs: 46 },
      bebe: { img: 'bebeSentado', x: 646, y: 1494, w: 410 }, logo: { x: 52, y: 1548, w: 290 }, producto: { x: 372, y: 1636, w: 200 } },
    inicio: { selector: { x: 250, y: 26, w: 580, h: 96 }, titulo: { x: 540, y: 212, fs: 132 }, sub: { x: 540, y: 318, fs: 60 },
      instr: { x: 540, y: 392, fs: 38, lh: 48, lineas: ['Toca dos cartas y encuentra las 8 parejas.', 'Al empezar las verás todas por 5 segundos.', 'Tienes 3 oportunidades.'] },
      demo: { x: 212, y: 540, cw: 200, ch: 230, gap: 28, cols: 3 }, boton: { x: 250, y: 1072, w: 580, h: 156 },
      bebe: { img: 'bebeIngeniero', x: 708, y: 1262, h: 630 }, logo: { x: 56, y: 1480, w: 320 }, producto: { x: 400, y: 1600, w: 230 } },
    panel: { x: 60, y: 150, w: 960, h: 1180 } },
  h: { W: 1920, H: 1080, horizonte: 760, arena: 935,
    juego: { grilla: { x: 533, y: 76, w: 854, gap: 18, ch: 230 },
      parejas: { x: 1450, y: 470, w: 430, h: 240, filas: 2 }, vidas: { x: 1450, y: 740, w: 430, h: 120 },
      cuenta: { x: 1450, y: 450, w: 430, h: 440 }, titulo: { x: 1665, y: 118, fs: 88 }, sub: { x: 1665, y: 206, fs: 46 },
      bebe: { img: 'bebeSentado', x: 40, y: 640, w: 430 }, logo: { x: 110, y: 44, w: 290 }, producto: { x: 168, y: 372, w: 190 } },
    inicio: { selector: { x: 1338, y: 964, w: 500, h: 96 }, titulo: { x: 1588, y: 196, fs: 132 }, sub: { x: 1588, y: 306, fs: 60 },
      instr: { x: 1588, y: 396, fs: 38, lh: 50, lineas: ['Toca dos cartas y', 'encuentra las 8 parejas.', 'Al empezar las verás', 'todas por 5 segundos.', 'Tienes 3 oportunidades.'] },
      demo: { x: 520, y: 236, cw: 230, ch: 265, gap: 28, cols: 3 }, boton: { x: 1338, y: 766, w: 500, h: 156 },
      bebe: { img: 'bebeIngeniero', x: 104, y: 418, h: 640 }, logo: { x: 76, y: 36, w: 250 }, producto: { x: 806, y: 846, w: 180 } },
    panel: { x: 420, y: 50, w: 1080, h: 980 } },
};
let LY = LAYOUTS.v;

function slotCarta(i) { const g = LY.juego.grilla, cw = (g.w - g.gap * 3) / 4, col = i % 4, fila = Math.floor(i / 4);
  return { x: g.x + col * (cw + g.gap), y: g.y + fila * (g.ch + g.gap), w: cw, h: g.ch }; }
function slotDemo(i) { const d = LY.inicio.demo, col = i % d.cols, fila = Math.floor(i / d.cols);
  return { x: d.x + col * (d.cw + d.gap), y: d.y + fila * (d.ch + d.gap), w: d.cw, h: d.ch }; }
function rectSlot(k) { const p = LY.juego.parejas;
  if (p.filas === 1) { const s = 62, gap = (p.w - 48 - 8 * s) / 7; return { x: p.x + 24 + k * (s + gap), y: p.y + (p.h - s) / 2, w: s, h: s }; }
  const s = 76, gap = 16, ox = p.x + (p.w - (4 * s + 3 * gap)) / 2, c = k % 4, f = Math.floor(k / 4);
  return { x: ox + c * (s + gap), y: p.y + 66 + f * (s + 12), w: s, h: s }; }
const centro = r => ({ x: r.x + r.w / 2, y: r.y + r.h / 2 });

/* ======================= Recursos ======================= */
const IMGS = { logo: 'img/logo.png', bebeSentado: 'img/bebe-sentado.png', bebeIngeniero: 'img/bebe-ingeniero.png',
  panalPants: 'img/panal-pants.png', panalG: 'img/panal-g.png', panalAcuatico: 'img/panal-acuatico.png',
  toallitaAzul: 'img/toallita-azul.png', toallitaBlanca: 'img/toallita-blanca.png', toallitaRosa: 'img/toallita-rosa.png' };
/* En la cara de la carta los bebés van recortados a lo que se ve (en nativo, un TextureRegion); el logo y los
   productos van completos. Medidas en píxeles de cada PNG. */
const REGION = { bebeSentado: [135, 34, 799, 881], bebeIngeniero: [71, 86, 582, 1245] };
const IM = {};
function cargarImagen(k) { return new Promise(ok => { const im = new Image(); im.onload = () => { IM[k] = im; ok(); }; im.onerror = () => ok(); im.src = recurso(IMGS[k]); }); }
// dibuja una imagen con su proporción original: se da el ancho o el alto, nunca los dos
function imagen(k, x, y, w, h) { const im = IM[k]; if (!im) return; const a = im.naturalWidth / im.naturalHeight;
  if (w == null) w = h * a; else h = w / a; ctx.drawImage(im, x, y, w, h); return { w, h }; }

/* ======================= Utilidades de dibujo ======================= */
const lerp = (a, b, k) => a + (b - a) * k, clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const easeOut = k => 1 - Math.pow(1 - clamp(k, 0, 1), 3);
const easeIn = k => Math.pow(clamp(k, 0, 1), 3);
const easeInOut = k => { k = clamp(k, 0, 1); return k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2; };
const easeBack = k => { k = clamp(k, 0, 1); const s = 1.70158; return 1 + (s + 1) * Math.pow(k - 1, 3) + s * Math.pow(k - 1, 2); };
const FUENTE = (peso, tam) => `${peso} ${tam}px Fredoka, "Arial Rounded MT Bold", "Trebuchet MS", sans-serif`;
function rr(c, x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
function texto(s, x, y, o) {
  ctx.save(); ctx.font = FUENTE(o.peso || 700, o.fs);
  let k = o.k || 1; if (o.max) { const w = ctx.measureText(s).width; if (w * k > o.max) k = o.max / w; }
  ctx.translate(x, y); if (k !== 1) ctx.scale(k, k);
  ctx.textAlign = o.al || 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  if (o.sombra) { ctx.fillStyle = o.sombra; if (o.borde) { ctx.lineWidth = o.borde; ctx.strokeStyle = o.sombra; ctx.strokeText(s, 0, o.fs * .08); } ctx.fillText(s, 0, o.fs * .08); }
  if (o.borde) { ctx.lineWidth = o.borde; ctx.strokeStyle = o.colorBorde || C.blanco; ctx.strokeText(s, 0, 0); }
  ctx.fillStyle = o.color || C.tinta; ctx.fillText(s, 0, 0); ctx.restore();
}
function lienzoAparte(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h)); return c; }
function corazon(c, cx, cy, s) { // corazón de lado s, centrado
  c.beginPath(); c.moveTo(cx, cy + s * .38);
  c.bezierCurveTo(cx - s * .62, cy - s * .02, cx - s * .42, cy - s * .52, cx, cy - s * .22);
  c.bezierCurveTo(cx + s * .42, cy - s * .52, cx + s * .62, cy - s * .02, cx, cy + s * .38); c.closePath(); }
function estrella4(c, x, y, r) { c.beginPath(); for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4, q = i % 2 ? r * .28 : r; c.lineTo(x + Math.cos(a) * q, y + Math.sin(a) * q); } c.closePath(); }
function estrella5(c, x, y, r, rot = 0) { c.beginPath(); for (let i = 0; i < 10; i++) { const a = rot - Math.PI / 2 + i * Math.PI / 5, q = i % 2 ? r * .48 : r; c.lineTo(x + Math.cos(a) * q, y + Math.sin(a) * q); } c.closePath(); }
// sello ondulado, como el borde del logo (solo la forma, nunca el logo)
function feston(c, cx, cy, r, n = 12, amp = .07) { c.beginPath(); for (let i = 0; i <= 96; i++) { const a = i / 96 * Math.PI * 2, q = r * (1 + amp * Math.cos(n * a)); c.lineTo(cx + Math.cos(a) * q, cy + Math.sin(a) * q); } c.closePath(); }
function visto(c, x, y, s, color) { // círculo con el visto (✓) de pareja encontrada
  c.fillStyle = 'rgba(0,40,20,.25)'; c.beginPath(); c.arc(x, y + s * .08, s, 0, 6.29); c.fill();
  c.fillStyle = color || C.verde; c.beginPath(); c.arc(x, y, s, 0, 6.29); c.fill(); c.lineWidth = s * .16; c.strokeStyle = '#FFFFFF'; c.stroke();
  c.lineCap = 'round'; c.lineJoin = 'round'; c.lineWidth = s * .24; c.beginPath(); c.moveTo(x - s * .42, y + s * .02); c.lineTo(x - s * .1, y + s * .34); c.lineTo(x + s * .46, y - s * .3); c.stroke(); }

/* ======================= Imágenes horneadas (en nativo: texturas) ======================= */
const H_ = {};
const CB = { w: 240, h: 276, r: 26 };     // carta base; todas las cartas guardan esta proporción
let pxC = 1;                              // resolución de las cartas horneadas
function hornearTodo() {
  pxC = Math.min(px, 2.2);
  if (AMB === 'parque') { hornearFondoParque(); hornearNube(); hornearAla(); } else { hornearFondoMar(); hornearPeces(); hornearAlgas(); }
  hornearBrillo(); hornearHalo(); hornearSombraCarta(); hornearReverso(); hornearCaras();
}
function hornearFondoParque() {     // el mismo cielo, colinas y flores de la sopa
  const cv = lienzoAparte(W * px, H * px), c = cv.getContext('2d'); c.scale(px, px);
  const hz = LY.horizonte;
  const cielo = c.createLinearGradient(0, 0, 0, hz + 60);
  cielo.addColorStop(0, '#3AA6EA'); cielo.addColorStop(.55, '#7FCBF4'); cielo.addColorStop(1, '#D4F0FC');
  c.fillStyle = cielo; c.fillRect(0, 0, W, H);
  const sol = c.createRadialGradient(W * .86, H * .06, 0, W * .86, H * .06, W * .5);
  sol.addColorStop(0, 'rgba(255,255,240,.55)'); sol.addColorStop(1, 'rgba(255,255,240,0)'); c.fillStyle = sol; c.fillRect(0, 0, W, H);
  const colina = (y0, amp, fase, col1, col2) => { c.beginPath(); c.moveTo(0, H); c.lineTo(0, y0);
    const n = 3; for (let i = 0; i < n; i++) { const x0 = W * i / n, x1 = W * (i + 1) / n;
      c.quadraticCurveTo((x0 + x1) / 2, y0 - amp * (i % 2 === fase ? 1 : -.4), x1, y0 + (i % 2 ? amp * .2 : 0)); }
    c.lineTo(W, H); c.closePath(); const g = c.createLinearGradient(0, y0 - amp, 0, H); g.addColorStop(0, col1); g.addColorStop(1, col2); c.fillStyle = g; c.fill(); };
  colina(hz - 10, 70, 0, '#A9DE7A', '#7CC456');
  colina(hz + 70, 60, 1, '#78C94F', '#4FA83A');
  colina(hz + 170, 40, 0, '#5DBB45', '#3E9630');
  const rnd = mulberry32(77);
  for (let i = 0; i < (O === 'v' ? 46 : 60); i++) {
    const x = rnd() * W, y = hz + 110 + rnd() * (H - hz - 120), s = 6 + rnd() * 7;
    c.fillStyle = 'rgba(255,255,255,.95)'; for (let k = 0; k < 5; k++) { const a = k * Math.PI * 2 / 5 + rnd();
      c.beginPath(); c.ellipse(x + Math.cos(a) * s * .8, y + Math.sin(a) * s * .5, s * .55, s * .32, a, 0, Math.PI * 2); c.fill(); }
    c.fillStyle = '#FFC93C'; c.beginPath(); c.arc(x, y, s * .38, 0, Math.PI * 2); c.fill();
  }
  c.strokeStyle = 'rgba(40,120,30,.45)'; c.lineWidth = 3; c.lineCap = 'round';
  for (let i = 0; i < 90; i++) { const x = rnd() * W, y = hz + 120 + rnd() * (H - hz - 110);
    for (let k = -1; k <= 1; k++) { c.beginPath(); c.moveTo(x, y); c.quadraticCurveTo(x + k * 4, y - 8, x + k * 9, y - 16); c.stroke(); } }
  H_.fondo = cv;
}
function hornearFondoMar() {
  const cv = lienzoAparte(W * px, H * px), c = cv.getContext('2d'); c.scale(px, px);
  const hz = LY.arena, rnd = mulberry32(41);
  const agua = c.createLinearGradient(0, 0, 0, H);
  agua.addColorStop(0, '#86E3F8'); agua.addColorStop(.28, '#3EBDE9'); agua.addColorStop(.7, '#1987CC'); agua.addColorStop(1, '#0C5B9F');
  c.fillStyle = agua; c.fillRect(0, 0, W, H);
  // luz de la superficie
  const sup = c.createRadialGradient(W * .5, -H * .05, 0, W * .5, -H * .05, W * .8);
  sup.addColorStop(0, 'rgba(255,255,255,.45)'); sup.addColorStop(1, 'rgba(255,255,255,0)'); c.fillStyle = sup; c.fillRect(0, 0, W, H);
  // rayos de luz que bajan desde arriba
  for (let i = 0; i < 7; i++) { const x0 = W * (i / 7) + rnd() * W * .08, ancho = 40 + rnd() * 70, largo = H * (.55 + rnd() * .25), inc = W * (.12 + rnd() * .06);
    const g = c.createLinearGradient(0, 0, 0, largo); g.addColorStop(0, 'rgba(255,255,255,.22)'); g.addColorStop(1, 'rgba(255,255,255,0)');
    c.fillStyle = g; c.beginPath(); c.moveTo(x0, 0); c.lineTo(x0 + ancho, 0); c.lineTo(x0 + ancho * 2.6 + inc, largo); c.lineTo(x0 + inc, largo); c.closePath(); c.fill(); }
  // rocas lejanas, azuladas
  c.fillStyle = 'rgba(10,70,130,.35)';
  c.beginPath(); c.moveTo(0, hz + 10); for (let x = 0; x <= W; x += W / 8) c.quadraticCurveTo(x + W / 16, hz - 70 - rnd() * 60, x + W / 8, hz - 10); c.lineTo(W, H); c.lineTo(0, H); c.closePath(); c.fill();
  // corales a los lados
  const coral = (x, y, s, color) => { c.strokeStyle = color; c.lineCap = 'round'; c.lineWidth = s * .16;
    const rama = (x0, y0, a, l, n) => { const x1 = x0 + Math.cos(a) * l, y1 = y0 + Math.sin(a) * l; c.beginPath(); c.moveTo(x0, y0); c.lineTo(x1, y1); c.stroke();
      if (n > 0) { rama(x1, y1, a - .45 - rnd() * .2, l * .72, n - 1); rama(x1, y1, a + .45 + rnd() * .2, l * .72, n - 1); } };
    rama(x, y, -Math.PI / 2, s * .55, 3); };
  const ladoCorales = O === 'v' ? [[60, hz + 40, 150, '#FF7FA8'], [W - 70, hz + 30, 170, '#FF9F4A'], [W - 190, hz + 60, 110, '#FF7FA8']]
    : [[60, hz + 40, 150, '#FF7FA8'], [W - 80, hz + 30, 170, '#FF9F4A'], [W * .62, hz + 70, 110, '#B98BFF'], [W - 300, hz + 60, 120, '#FF7FA8']];
  ladoCorales.forEach(([x, y, s, col]) => coral(x, y, s, col));
  // arena con dunas
  c.beginPath(); c.moveTo(0, H); c.lineTo(0, hz + 20);
  for (let i = 0; i < 4; i++) { const x0 = W * i / 4, x1 = W * (i + 1) / 4; c.quadraticCurveTo((x0 + x1) / 2, hz - 26 + (i % 2) * 40, x1, hz + 14); }
  c.lineTo(W, H); c.closePath();
  const ar = c.createLinearGradient(0, hz - 30, 0, H); ar.addColorStop(0, '#F8E3AE'); ar.addColorStop(1, '#E2BC74'); c.fillStyle = ar; c.fill();
  // piedritas, conchas y estrellas de mar
  for (let i = 0; i < 70; i++) { const x = rnd() * W, y = hz + 40 + rnd() * (H - hz - 50); c.fillStyle = rnd() < .5 ? 'rgba(160,120,60,.35)' : 'rgba(255,255,255,.55)';
    c.beginPath(); c.ellipse(x, y, 3 + rnd() * 5, 2 + rnd() * 3, 0, 0, 6.29); c.fill(); }
  for (let i = 0; i < (O === 'v' ? 5 : 7); i++) { const x = 40 + rnd() * (W - 80), y = hz + 70 + rnd() * (H - hz - 110), s = 16 + rnd() * 12;
    if (i % 2) { c.fillStyle = '#FF8A5B'; estrella5(c, x, y, s, rnd()); c.fill(); c.fillStyle = 'rgba(255,255,255,.6)'; c.beginPath(); c.arc(x, y, s * .15, 0, 6.29); c.fill(); }
    else { c.fillStyle = '#FFE3EE'; c.beginPath(); c.moveTo(x, y + s * .5); for (let k = 0; k <= 8; k++) { const a = Math.PI + k * Math.PI / 8; c.lineTo(x + Math.cos(a) * s, y + Math.sin(a) * s * .9); } c.closePath(); c.fill();
      c.strokeStyle = 'rgba(200,120,150,.6)'; c.lineWidth = 2; for (let k = 1; k < 8; k++) { const a = Math.PI + k * Math.PI / 8; c.beginPath(); c.moveTo(x, y + s * .5); c.lineTo(x + Math.cos(a) * s * .9, y + Math.sin(a) * s * .8); c.stroke(); } } }
  H_.fondo = cv;
}

    ctx.save(); ctx.globalAlpha = k < .7 ? 1 : (1 - k) / .3; ctx.translate(t.x, t.y - easeOut(k) * 70); const e = easeBack(k / .25); ctx.scale(e, e);
    texto(t.s, 0, 0, { fs: t.fs, color: t.color, borde: 14, colorBorde: '#FFFFFF', sombra: 'rgba(0,30,90,.3)' }); ctx.restore(); }
  if (cartel) { const k = (tAhora - cartel.t0) / cartel.dur; if (k > 1) { cartel = null; return; } if (k < 0) return;
    const e = k < .2 ? easeBack(k / .2) : 1, a = k > .85 ? (1 - k) / .15 : 1;
    ctx.save(); ctx.globalAlpha = a; ctx.translate(cartel.x, cartel.y); ctx.rotate(-.04); ctx.scale(e, e);
    texto(cartel.s, 0, 0, { fs: cartel.fs || 112, color: cartel.color, borde: 22, colorBorde: '#FFFFFF', sombra: 'rgba(0,30,90,.35)', max: (O === 'v' ? 980 : 840) }); ctx.restore(); }
}
function pantallaResultado() {
  const P = LY.panel, te = tAhora - tEstado, gano = motivoFin === 'victoria';
  ctx.fillStyle = `rgba(0,40,110,${.38 * clamp(te / .4, 0, 1)})`; ctx.fillRect(0, 0, W, H);
  // la marca y el bebé quedan por encima del velo: el logo nunca cambia de color (D-022)
  dibujarMarca(LY.juego); dibujarBebe(LY.juego.bebe, gano ? null : 'triste');
  const k = easeBack(te / .5); if (k <= 0) return;
  ctx.save(); ctx.translate(P.x + P.w / 2, P.y + P.h / 2); ctx.scale(k, k); ctx.translate(-P.w / 2, -P.h / 2);
  rr(ctx, 0, 18, P.w, P.h, 60); ctx.fillStyle = 'rgba(0,25,80,.3)'; ctx.fill();
  rr(ctx, 0, 0, P.w, P.h, 60); ctx.fillStyle = '#FFFFFF'; ctx.fill(); ctx.lineWidth = 10; ctx.strokeStyle = C.azul; ctx.stroke();
  rr(ctx, 18, 18, P.w - 36, P.h - 36, 46); ctx.lineWidth = 4; ctx.strokeStyle = C.rojo; ctx.stroke();
  // franja del ambiente arriba del panel (horneada aparte: en nativo, un recorte del fondo)
  const fh = P.h * (O === 'v' ? .22 : .2);
  ctx.save(); rr(ctx, 30, 30, P.w - 60, fh, 40); ctx.clip();
  const sh = H * .3, sw = Math.min(W, sh * (P.w - 60) / fh), sy = AMB === 'mar' ? H * .35 : 0;
  ctx.drawImage(H_.fondo, (W - sw) / 2 * px, sy * px, sw * px, sh * px, 30, 30, P.w - 60, fh);
  if (AMB === 'parque') { ctx.globalAlpha = .9; ctx.drawImage(H_.nube, 40 + Math.sin(tAhora * .3) * 20, 50, H_.nubeW * .45, H_.nubeH * .45); ctx.drawImage(H_.nube, P.w - 260 - Math.sin(tAhora * .25) * 20, 90, H_.nubeW * .55, H_.nubeH * .55); }
  else for (let i = 0; i < 9; i++) { const u = ((tAhora * .25 + i * .37) % 1), x = 60 + ((i * 113) % (P.w - 120)), y = 30 + fh - u * fh;
    ctx.globalAlpha = .7 * Math.sin(u * Math.PI); ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(x + Math.sin(tAhora * 2 + i) * 8, y, 6 + (i % 3) * 4, 0, 6.29); ctx.stroke(); }
  ctx.globalAlpha = 1; ctx.restore();
  const titulo = gano ? '¡Lo lograste!' : '¡Casi lo logras!', kt = easeBack((te - .25) / .45);
  ctx.save(); ctx.translate(P.w / 2, 30 + fh / 2); ctx.scale(kt, kt); ctx.rotate(Math.sin(tAhora * 2) * .015);
  texto(titulo, 0, 0, { fs: O === 'v' ? 112 : 104, color: gano ? C.rojo : C.azul, borde: 20, colorBorde: '#FFFFFF', sombra: 'rgba(0,30,90,.3)', max: P.w - 120 }); ctx.restore();
  const n = partida.parejas, errores = partida.errores;
  const l1 = gano ? 'Encontraste las 8 parejas.' : 'Se acabaron las 3 oportunidades.';
  const l2 = gano ? (errores === 0 ? '¡Sin un solo error! Qué memoria.' : '¡Qué buena memoria tienes!') : `Encontraste ${n} de 8 parejas. ¡Inténtalo otra vez!`;
  const y0 = 30 + fh + (O === 'v' ? 66 : 58);
  texto(l1, P.w / 2, y0, { fs: 50, color: C.tinta, max: P.w - 120 });
  texto(l2, P.w / 2, y0 + 66, { fs: 42, peso: 600, color: gano ? C.rojo : C.tinta, max: P.w - 120 });
  // las 8 cartas de la partida: las encontradas con su visto
  const cols = 4, mw = O === 'v' ? 168 : 128, mh = mw * CB.h / CB.w, gx = O === 'v' ? 26 : 30, gy = O === 'v' ? 22 : 16;
  const x0 = (P.w - (cols * mw + (cols - 1) * gx)) / 2, yy = y0 + (O === 'v' ? 120 : 106);
  partida.elegidas.forEach((id, i) => { const c = i % cols, f = Math.floor(i / cols), x = x0 + c * (mw + gx), y = yy + f * (mh + gy);
    const kk = easeBack((te - .5 - i * .07) / .35); if (kk <= 0) return;
    const ok = partida.orden.includes(id);
    ctx.save(); ctx.translate(x + mw / 2, y + mh / 2); ctx.scale(kk, kk); ctx.rotate(Math.sin(tAhora * 1.5 + i) * (ok && gano ? .03 : 0));
    ctx.drawImage(H_.caras[id], -mw / 2, -mh / 2, mw, mh);
    if (ok) { rr(ctx, -mw / 2 + 2, -mh / 2 + 2, mw - 4, mh - 4, CB.r * mw / CB.w); ctx.lineWidth = 6 * mw / CB.w + 2; ctx.strokeStyle = C.oro; ctx.stroke(); visto(ctx, mw / 2 - 12, -mh / 2 + 12, Math.max(14, 22 * mw / CB.w)); }
    ctx.restore(); });
  ctx.restore();
  const bw = O === 'v' ? 600 : 560, bh = 150, bx = P.x + (P.w - bw) / 2, by = P.y + P.h - bh - 60;
  boton('otra', bx, by, bw, bh, 'JUGAR DE NUEVO', () => { if (tAhora - tEstado > GUARDA_RESULTADO) empezar(); }, te > GUARDA_RESULTADO, (te - .7) / .45);
  if (tAhora - ultimaActividad > INACTIVIDAD && te > INACTIVIDAD) irAInicio();
}

/* ======================= Bucle ======================= */
let tPrevio = 0;
function actualizar(dt) {
  correrAgenda();
  if (estado === 'fin' && motivoFin === 'victoria' && Math.random() < dt * 3) confeti(6);
  if (estado === 'resultado' && festejo && Math.random() < dt * 2) confeti(4);
  // si dejan una partida a medias, vuelve sola al inicio
  if (estado === 'juego' && tAhora - ultimaActividad > ABANDONO) irAInicio();
  // detalle de sonido del ambiente: un pajarito o unas burbujas de vez en cuando
  if (tAhora > amb.proxSonido) { amb.proxSonido = tAhora + 7 + Math.random() * 8; if (estado !== 'fin') { if (AMB === 'parque') SFX.pajaro(); else SFX.burbujeo(); } }
  actualizarParticulas(dt);
}
function dibujar(dt) {
  ctx.setTransform(px, 0, 0, px, 0, 0);
  dibujarFondo(dt); dibujarMariposas();
  botones.forEach(b => b.activo = false);
  if (estado === 'inicio') pantallaInicio();
  else if (partida) { pantallaJuego(); if (estado === 'resultado') pantallaResultado(); }
  dibujarParticulas(); dibujarTextos();
}
function cuadro(ms) {
  const t = ms / 1000, dt = Math.min(.05, Math.max(0, t - tPrevio)); tPrevio = t; tAhora = t;
  if (estado !== 'carga') { actualizar(dt); dibujar(dt); }
  requestAnimationFrame(cuadro);
}

/* ======================= Escala por escenario fijo ======================= */
function ajustar() {
  const o = orientacionDeseada(); const cambio = o !== O || !H_.fondo;
  O = o; LY = LAYOUTS[O]; W = LY.W; H = LY.H;
  escala = Math.min(innerWidth / W, innerHeight / H);
  const dpr = window.devicePixelRatio || 1; const nuevoPx = Math.min(escala * dpr, 3840 / Math.max(W, H));
  lienzo.style.width = W * escala + 'px'; lienzo.style.height = H * escala + 'px';
  lienzo.style.left = (innerWidth - W * escala) / 2 + 'px'; lienzo.style.top = (innerHeight - H * escala) / 2 + 'px';
  lienzo.width = Math.round(W * nuevoPx); lienzo.height = Math.round(H * nuevoPx);
  if ((cambio || Math.abs(nuevoPx - px) > .01) && estado !== 'carga') { px = nuevoPx; hornearTodo(); prepararAmbiente(); } else px = nuevoPx;
}
let reajuste = 0; addEventListener('resize', () => { clearTimeout(reajuste); reajuste = setTimeout(ajustar, 120); });
document.addEventListener('visibilitychange', () => { if (!AC) return; if (document.hidden) AC.suspend(); else AC.resume(); });

/* ======================= Ayudas para revisar la maqueta ======================= */
const sePuede = () => estado === 'juego' && partida.estado === 'juego' && !partida.bloqueada && tAhora >= bloqueoHasta;
function jugar(i, j) { if (!sePuede() || i < 0 || j < 0) return false; ultimaActividad = tAhora; tocarCarta(i); tocarCarta(j); return true; }
window.memoria = {
  encontrar() { if (!sePuede()) return false;
    const i = partida.abiertas.length ? partida.abiertas[0] : partida.cartas.findIndex(c => !c.emparejada);
    const j = partida.cartas.findIndex((c, k) => k !== i && c.id === partida.cartas[i].id);
    if (partida.abiertas.length) { if (j >= 0) tocarCarta(j); return j >= 0; } return jugar(i, j); },
  fallar() { if (!sePuede()) return false;
    const i = partida.abiertas.length ? partida.abiertas[0] : partida.cartas.findIndex(c => !c.emparejada);
    const j = partida.cartas.findIndex((c, k) => k !== i && !c.emparejada && !c.arriba && c.id !== partida.cartas[i].id);
    if (partida.abiertas.length) { if (j >= 0) tocarCarta(j); return j >= 0; } return jugar(i, j); },
  abrir(i) { tocarCarta(i); },
  ganar() { const paso = () => { if (estado !== 'juego') return; window.memoria.encontrar(); programar(.6, paso); }; paso(); },
  perder() { if (estado !== 'juego') return; partida.errores = Math.max(partida.errores, ERRORES_MAX - 1); window.memoria.fallar(); },
  saltarVista() { if (estado !== 'vista') return; generacion++; agenda = []; terminarVista(); },
  ambiente: cambiarAmbiente, empezar, irAInicio, estado: () => estado, partida: () => partida,
  audio: () => ({ contexto: AC ? AC.state : 'sin iniciar', muestras: Object.keys(MUESTRAS), musica: mus.on ? (mus.src ? 'archivo' : 'sintetizada') : 'apagada' }),
};
if (PARAMS.get('depurar') === '1') addEventListener('keydown', e => { const k = e.key.toLowerCase(), m = window.memoria;
  if (k === '1') m.encontrar(); if (k === 'e') m.fallar(); if (k === 'g') m.ganar(); if (k === 'p') m.perder(); if (k === 'v') m.saltarVista();
  if (k === 'a' && estado === 'inicio') cambiarAmbiente(AMB === 'parque' ? 'mar' : 'parque'); });

/* ======================= Arranque ======================= */
async function arrancar() {
  document.body.style.background = AMBIENTES[AMB].fondoPagina;
  ajustar();
  const fuentes = Promise.all([document.fonts.load(FUENTE(700, 50)), document.fonts.load(FUENTE(600, 50))]).catch(() => {});
  await Promise.race([Promise.all([fuentes, ...Object.keys(IMGS).map(cargarImagen)]), new Promise(r => setTimeout(r, 4000))]);
  hornearTodo(); prepararAmbiente();
  irAInicio();
}
requestAnimationFrame(cuadro);
arrancar();
})();
</script>
