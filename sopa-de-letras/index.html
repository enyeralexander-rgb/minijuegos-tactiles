<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Sopa de letras Baby Finger</title>
<!--
  Maqueta de la Sopa de letras de Baby Finger (sprint B1). Solo sirve para aprobar aspecto, sonido y sensación
  antes de construirla en libGDX.

  Todo se dibuja en un solo lienzo con lo mismo que tiene libGDX: imágenes (texturas), formas llenas, líneas con
  puntas redondas, texto con borde (FreeType), transparencia, giro y escala, y recorte rectangular. Los fondos, el
  plato y las letras de pasta se "hornean" una vez en imágenes aparte (en nativo serán PNG o Pixmap); en cada cuadro
  solo se pegan y se mueven. No se usan filtros, desenfoques ni sombras del navegador al dibujar cada cuadro.

  Parámetros de la dirección: ?o=v o ?o=h fuerzan la orientación, ?semilla=123 repite una partida,
  ?musica=0 quita la música, ?musica=sintetizada usa la base hecha por código, ?depurar=1 activa teclas
  (1 encuentra una palabra, E error, G gana, P pierde, T deja 12 s).
-->
<style>
@font-face{font-family:'Fredoka';src:url(fuentes/Fredoka-Bold.ttf) format('truetype');font-weight:700;font-display:block}
@font-face{font-family:'Fredoka';src:url(fuentes/Fredoka-SemiBold.ttf) format('truetype');font-weight:600;font-display:block}
html,body{margin:0;height:100%;overflow:hidden;background:#7cc8f2;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#lienzo{position:absolute;display:block;touch-action:none;cursor:pointer}
</style>
</head>
<body>
<canvas id="lienzo"></canvas>
<script>
'use strict';
(() => {
const PARAMS = new URLSearchParams(location.search);
const EMB = window.__SOPA_EMB || null;              // en el archivo compartible todo viene incrustado
const recurso = n => (EMB && EMB[n]) ? EMB[n] : n;

/* ======================= Reglas (decididas por Alexander) ======================= */
const PALABRAS = ['MOTRICIDAD', 'ESTIMULACION', 'ALIMENTO', 'VITAMINAS', 'INFANCIA', 'DERMATITIS', 'VINCULO',
  'CRECIMIENTO', 'VACUNAS', 'SALUD', 'ETAPAS', 'PROTECCION', 'PAÑALES', 'CUIDADO', 'DESARROLLO', 'PEDIATRA',
  'LACTANCIA', 'NUTRICION', 'TOALLITAS', 'PANTS'];
const N = 12, POR_PARTIDA = 6, ERRORES_MAX = 3, TIEMPO = 60, INACTIVIDAD = 45, ENTRADA = 1.4, GUARDA_RESULTADO = 1.2;

/* Colores de la marca y del mundo de los empaques */
const C = { rojo: '#DC1C26', rojoOsc: '#A0121A', azul: '#00348A', azulOsc: '#00225C', blanco: '#FFFFFF',
  tinta: '#0B2A66', gris: '#C5D0DF', pasta: '#7A3F08' };
/* un color por palabra encontrada (se reparten al azar en cada partida) */
const COLORES_PALABRA = ['#DC1C26', '#1E7BE0', '#22A356', '#8A56D6', '#E8488F', '#0E9C9C'];
const ELOGIOS = ['¡Muy bien!', '¡Genial!', '¡Excelente!', '¡Bien hecho!', '¡Súper!', '¡Lo tienes!'];

/* ======================= Azar con semilla ======================= */
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let semilla = PARAMS.has('semilla') ? Number(PARAMS.get('semilla')) >>> 0 : (Math.random() * 1e9) >>> 0;
const FIJA = PARAMS.has('semilla');   // con ?semilla las partidas se repiten en el mismo orden
const nuevaSemilla = () => { semilla = (semilla * 1103515245 + 12345 + (FIJA ? 0 : (Math.random() * 1e6) | 0)) >>> 0; return semilla; };
function barajar(arr, rnd) { const d = arr.slice(); for (let i = d.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [d[i], d[j]] = [d[j], d[i]]; } return d; }

/* ======================= Armado de la cuadrícula =======================
   Solo tres direcciones de sopa convencional: derecha, abajo y diagonal abajo a la derecha.
   La palabra más larga va primero; se elige la dirección menos usada y, dentro de ella, una posición al azar
   entre todas las que caben (solo se cruzan dos palabras si comparten la misma letra).
   Al final se comprueba en las 8 direcciones que cada palabra aparece una sola vez (el relleno no puede
   formar una segunda copia, ni al revés, porque el juego acepta arrastrar del final al principio). */
const DIRS = [[0, 1], [1, 0], [1, 1]];
const OCHO = [[0, 1], [1, 0], [1, 1], [0, -1], [-1, 0], [-1, -1], [1, -1], [-1, 1]];
// relleno con letras del español; la Ñ, K, W y X salen poco
const PESOS = { A: 11, E: 11, O: 8, S: 6, R: 6, N: 6, I: 6, D: 4, L: 5, C: 4, T: 4, U: 4, M: 3, P: 3, B: 2, G: 2, V: 2,
  H: 1.5, F: 1.5, Y: 1.2, Q: 1, Z: 1, J: 1, 'Ñ': .5, X: .4, K: .3, W: .3 };
const LETRAS_RELLENO = Object.keys(PESOS), TOTAL_PESOS = LETRAS_RELLENO.reduce((s, k) => s + PESOS[k], 0);
function letraAlAzar(rnd) { let x = rnd() * TOTAL_PESOS; for (const k of LETRAS_RELLENO) { x -= PESOS[k]; if (x <= 0) return k; } return 'A'; }
const letrasDe = p => Array.from(p);                 // la Ñ cuenta como una letra

function contarApariciones(g, palabra) {
  const L = letrasDe(palabra); let n = 0;
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) for (const [dr, dc] of OCHO) {
    const rf = r + dr * (L.length - 1), cf = c + dc * (L.length - 1);
    if (rf < 0 || rf >= N || cf < 0 || cf >= N) continue;
    let ok = true; for (let i = 0; i < L.length && ok; i++) ok = g[r + dr * i][c + dc * i] === L[i];
    if (ok) n++;
  }
  return n;
}
function colocar(palabras, rnd) {
  const g = Array.from({ length: N }, () => Array(N).fill(''));
  const usadas = [0, 0, 0], puestas = [];
  for (const p of palabras.slice().sort((a, b) => letrasDe(b).length - letrasDe(a).length)) {
    const L = letrasDe(p);
    const orden = [0, 1, 2].map(d => [d, usadas[d] + rnd() * .9]).sort((a, b) => a[1] - b[1]).map(x => x[0]);
    let elegida = null;
    for (const d of orden) {
      const [dr, dc] = DIRS[d], cands = [];
      for (let r = 0; r + dr * (L.length - 1) < N; r++) for (let c = 0; c + dc * (L.length - 1) < N; c++) {
        let ok = true, cruces = 0;
        for (let i = 0; i < L.length && ok; i++) { const v = g[r + dr * i][c + dc * i]; if (v === L[i]) cruces++; else if (v !== '') ok = false; }
        if (ok && cruces <= 1) cands.push({ r, c, d });
      }
      if (cands.length) { elegida = cands[Math.floor(rnd() * cands.length)]; break; }
    }
    if (!elegida) return null;
    const [dr, dc] = DIRS[elegida.d], celdas = [];
    L.forEach((ch, i) => { const r = elegida.r + dr * i, c = elegida.c + dc * i; g[r][c] = ch; celdas.push([r, c]); });
    usadas[elegida.d]++;
    puestas.push({ palabra: p, celdas });
  }
  // relleno y validación (se rellena de nuevo si el azar formó una copia)
  for (let k = 0; k < 40; k++) {
    const h = g.map(f => f.map(v => v || letraAlAzar(rnd)));
    if (puestas.every(w => contarApariciones(h, w.palabra) === 1)) return { g: h, puestas };
  }
  return null;
}
function generar(rnd) {
  for (let i = 0; i < 300; i++) { const r = colocar(barajar(PALABRAS, rnd).slice(0, POR_PARTIDA), rnd); if (r) return r; }
  throw new Error('No se pudo armar la sopa');
}

/* ======================= Escenario fijo y orientación ======================= */
const lienzo = document.getElementById('lienzo'), ctx = lienzo.getContext('2d');
let O = 'v', W = 1080, H = 1920, escala = 1, px = 1;      // px: píxeles reales por unidad del escenario
function orientacionDeseada() { const f = PARAMS.get('o'); if (f === 'v' || f === 'h') return f; return innerHeight >= innerWidth ? 'v' : 'h'; }

/* Distribución de cada orientación (unidades de 1080p). Vertical: lo que se toca arriba, la marca abajo (D-013).
   Horizontal: lo que se toca abajo y al centro, la marca arriba a la izquierda (D-014). */
const LAYOUTS = {
  v: { W: 1080, H: 1920, horizonte: 1500,
    juego: { plato: { x: 35, y: 184, s: 1010 }, reloj: { x: 40, y: 40, w: 560, h: 120 }, vidas: { x: 664, y: 46, w: 376, h: 108 },
      lista: { x: 40, y: 1222, w: 1000, cols: 2, ph: 70, gx: 20, gy: 12, fs: 40 },
      bebe: { img: 'sentado', x: 646, y: 1494, w: 410 }, logo: { x: 52, y: 1548, w: 290 },
      productos: [{ img: 'pants', x: 360, y: 1632, w: 210 }] },
    inicio: { titulo: { x: 540, y: 128, fs: 112 }, sub: { x: 540, y: 250, fs: 40, lh: 52 }, plato: { x: 210, y: 352, s: 660 },
      boton: { x: 250, y: 1072, w: 580, h: 156 }, bebe: { img: 'ingeniero', x: 708, y: 1262, h: 630 },
      logo: { x: 56, y: 1480, w: 320 }, productos: [{ img: 'panalG', x: 400, y: 1600, w: 230 }] },
    panel: { x: 70, y: 210, w: 940, h: 1030 } },
  h: { W: 1920, H: 1080, horizonte: 760,
    juego: { plato: { x: 466, y: 50, s: 990 }, reloj: { x: 1494, y: 246, w: 392, h: 116 }, vidas: { x: 1494, y: 378, w: 392, h: 100 },
      lista: { x: 1494, y: 500, w: 392, cols: 1, ph: 76, gx: 0, gy: 13, fs: 40 },
      titulo: { x: 1690, y: 92, fs: 64 },
      bebe: { img: 'sentado', x: 22, y: 640, w: 430 }, logo: { x: 108, y: 40, w: 250 }, productos: [] },
    inicio: { titulo: { x: 1588, y: 220, fs: 118 }, sub: { x: 1588, y: 470, fs: 40, lh: 54 }, plato: { x: 478, y: 214, s: 760 },
      boton: { x: 1338, y: 806, w: 500, h: 156 }, bebe: { img: 'ingeniero', x: 104, y: 418, h: 640 },
      logo: { x: 76, y: 36, w: 250 }, productos: [] },
    panel: { x: 420, y: 70, w: 1080, h: 940 } },
};
let LY = LAYOUTS.v;

function geometriaPlato(p) {
  const borde = p.s * .075, interior = p.s - 2 * borde, pad = interior * .025;
  const grilla = interior - 2 * pad, celda = grilla / N;
  return { x: p.x, y: p.y, s: p.s, borde, interior, gx: p.x + borde + pad, gy: p.y + borde + pad, grilla, celda,
    ix: p.x + borde, iy: p.y + borde };
}

/* ======================= Recursos ======================= */
const IMGS = { logo: 'img/logo.png', sentado: 'img/bebe-sentado.png', ingeniero: 'img/bebe-ingeniero.png',
  pants: 'img/panal-pants.png', panalG: 'img/panal-g.png' };
const IM = {};
function cargarImagen(k) { return new Promise(ok => { const im = new Image(); im.onload = () => { IM[k] = im; ok(); }; im.onerror = () => ok(); im.src = recurso(IMGS[k]); }); }
// dibuja una imagen con su proporción original: se da el ancho o el alto, nunca los dos
function imagen(k, x, y, w, h) { const im = IM[k]; if (!im) return; const a = im.naturalWidth / im.naturalHeight;
  if (w == null) w = h * a; else h = w / a; ctx.drawImage(im, x, y, w, h); return { w, h }; }

/* ======================= Utilidades de dibujo ======================= */
const lerp = (a, b, k) => a + (b - a) * k, clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const easeOut = k => 1 - Math.pow(1 - clamp(k, 0, 1), 3);
const easeBack = k => { k = clamp(k, 0, 1); const s = 1.70158; return 1 + (s + 1) * Math.pow(k - 1, 3) + s * Math.pow(k - 1, 2); };
const FUENTE = (peso, tam) => `${peso} ${tam}px Fredoka, "Arial Rounded MT Bold", "Trebuchet MS", sans-serif`;
function rr(c, x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
function texto(s, x, y, o) {
  ctx.save(); ctx.font = FUENTE(o.peso || 700, o.fs);
  let k = o.k || 1; if (o.max) { const w = ctx.measureText(s).width; if (w * k > o.max) k = o.max / w; }
  ctx.translate(x, y); if (k !== 1) ctx.scale(k, k);
  ctx.textAlign = o.al || 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  if (o.sombra) { ctx.fillStyle = o.sombra; if (o.borde) { ctx.lineWidth = o.borde; ctx.strokeStyle = o.sombra; ctx.strokeText(s, 0, o.fs * .08); } ctx.fillText(s, 0, o.fs * .08); }
  if (o.borde) { ctx.lineWidth = o.borde; ctx.strokeStyle = o.colorBorde || C.blanco; ctx.strokeText(s, 0, 0); }
  ctx.fillStyle = o.color || C.tinta; ctx.fillText(s, 0, 0); ctx.restore();
}
function lienzoAparte(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h)); return c; }
function corazon(c, cx, cy, s) { // corazón de lado s, centrado
  c.beginPath(); c.moveTo(cx, cy + s * .38);
  c.bezierCurveTo(cx - s * .62, cy - s * .02, cx - s * .42, cy - s * .52, cx, cy - s * .22);
  c.bezierCurveTo(cx + s * .42, cy - s * .52, cx + s * .62, cy - s * .02, cx, cy + s * .38); c.closePath(); }
function estrella4(c, x, y, r) { c.beginPath(); for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4, q = i % 2 ? r * .28 : r; c.lineTo(x + Math.cos(a) * q, y + Math.sin(a) * q); } c.closePath(); }
// cinta redonda (como un fideo): una línea gruesa con puntas redondas
function cinta(x1, y1, x2, y2, w, color, alfa = 1) {
  ctx.save(); ctx.globalAlpha *= alfa; ctx.lineCap = 'round'; ctx.strokeStyle = color; ctx.lineWidth = w;
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2 + .01, y2); ctx.stroke(); ctx.restore(); }

/* ======================= Imágenes horneadas (en nativo: texturas) ======================= */
const H_ = {};   // fondo, nube, plato, letras, brillo, vapor
function hornearTodo() {
  hornearFondo(); hornearNube(); hornearBrillo();
  H_.platoJuego = hornearPlato(LY.juego.plato.s); H_.platoInicio = hornearPlato(LY.inicio.plato.s);
  H_.letrasJuego = hornearLetras(geometriaPlato(LY.juego.plato).celda);
  H_.letrasInicio = hornearLetras(geometriaPlato(LY.inicio.plato).celda);
}
function hornearFondo() {
  const cv = lienzoAparte(W * px, H * px), c = cv.getContext('2d'); c.scale(px, px);
  const hz = LY.horizonte;
  const cielo = c.createLinearGradient(0, 0, 0, hz + 60);
  cielo.addColorStop(0, '#3AA6EA'); cielo.addColorStop(.55, '#7FCBF4'); cielo.addColorStop(1, '#D4F0FC');
  c.fillStyle = cielo; c.fillRect(0, 0, W, H);
  // resplandor de sol suave arriba a la derecha
  const sol = c.createRadialGradient(W * .86, H * .06, 0, W * .86, H * .06, W * .5);
  sol.addColorStop(0, 'rgba(255,255,240,.55)'); sol.addColorStop(1, 'rgba(255,255,240,0)'); c.fillStyle = sol; c.fillRect(0, 0, W, H);
  // colinas: atrás claras, adelante más verdes (como los empaques)
  const colina = (y0, amp, fase, col1, col2) => { c.beginPath(); c.moveTo(0, H); c.lineTo(0, y0);
    const n = 3; for (let i = 0; i < n; i++) { const x0 = W * i / n, x1 = W * (i + 1) / n;
      c.quadraticCurveTo((x0 + x1) / 2, y0 - amp * (i % 2 === fase ? 1 : -.4), x1, y0 + (i % 2 ? amp * .2 : 0)); }
    c.lineTo(W, H); c.closePath(); const g = c.createLinearGradient(0, y0 - amp, 0, H); g.addColorStop(0, col1); g.addColorStop(1, col2); c.fillStyle = g; c.fill(); };
  colina(hz - 10, 70, 0, '#A9DE7A', '#7CC456');
  colina(hz + 70, 60, 1, '#78C94F', '#4FA83A');
  colina(hz + 170, 40, 0, '#5DBB45', '#3E9630');
  // flores (margaritas) en el pasto
  const rnd = mulberry32(77);
  for (let i = 0; i < (O === 'v' ? 46 : 60); i++) {
    const x = rnd() * W, y = hz + 110 + rnd() * (H - hz - 120), s = 6 + rnd() * 7;
    c.fillStyle = 'rgba(255,255,255,.95)'; for (let k = 0; k < 5; k++) { const a = k * Math.PI * 2 / 5 + rnd();
      c.beginPath(); c.ellipse(x + Math.cos(a) * s * .8, y + Math.sin(a) * s * .5, s * .55, s * .32, a, 0, Math.PI * 2); c.fill(); }
    c.fillStyle = '#FFC93C'; c.beginPath(); c.arc(x, y, s * .38, 0, Math.PI * 2); c.fill();
  }
  // matas de pasto
  c.strokeStyle = 'rgba(40,120,30,.45)'; c.lineWidth = 3; c.lineCap = 'round';
  for (let i = 0; i < 90; i++) { const x = rnd() * W, y = hz + 120 + rnd() * (H - hz - 110);
    for (let k = -1; k <= 1; k++) { c.beginPath(); c.moveTo(x, y); c.quadraticCurveTo(x + k * 4, y - 8, x + k * 9, y - 16); c.stroke(); } }
  H_.fondo = cv;
}
function hornearNube() {
  const w = 420, h = 200, cv = lienzoAparte(w * px, h * px), c = cv.getContext('2d'); c.scale(px, px);
  const bolas = [[110, 130, 70], [190, 95, 88], [285, 120, 72], [345, 145, 50], [70, 150, 45], [230, 150, 70]];
  c.fillStyle = 'rgba(160,200,235,.55)'; bolas.forEach(([x, y, r]) => { c.beginPath(); c.arc(x, y + 10, r, 0, Math.PI * 2); c.fill(); });
  c.fillStyle = '#FFFFFF'; bolas.forEach(([x, y, r]) => { c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill(); });
  H_.nube = cv; H_.nubeW = w; H_.nubeH = h;
}
function hornearBrillo() { // mancha de luz suave para el caldo y el vapor
  const s = 128, cv = lienzoAparte(s, s), c = cv.getContext('2d'), g = c.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
  g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(.45, 'rgba(255,255,255,.45)'); g.addColorStop(1, 'rgba(255,255,255,0)');
  c.fillStyle = g; c.fillRect(0, 0, s, s); H_.brillo = cv;
}
function hornearPlato(s) {
  const m = s * .06, cv = lienzoAparte((s + 2 * m) * px, (s + 2 * m) * px), c = cv.getContext('2d'); c.scale(px, px); c.translate(m, m);
  const g = geometriaPlato({ x: 0, y: 0, s }), R = s * .13;
  // sombra suave en la mesa (horneada una sola vez)
  c.save(); c.shadowColor = 'rgba(0,40,90,.35)'; c.shadowBlur = s * .045; c.shadowOffsetY = s * .022;
  rr(c, 0, 0, s, s, R); c.fillStyle = '#FFFFFF'; c.fill(); c.restore();
  // loza blanca con brillo
  const loza = c.createLinearGradient(0, 0, s, s); loza.addColorStop(0, '#FFFFFF'); loza.addColorStop(.6, '#F3F7FC'); loza.addColorStop(1, '#DCE6F2');
  rr(c, 0, 0, s, s, R); c.fillStyle = loza; c.fill();
  // filete azul y línea roja de la marca en el ala del plato
  c.lineWidth = s * .014; c.strokeStyle = C.azul; rr(c, s * .018, s * .018, s - s * .036, s - s * .036, R * .9); c.stroke();
  c.lineWidth = s * .005; c.strokeStyle = C.rojo; rr(c, s * .035, s * .035, s - s * .07, s - s * .07, R * .8); c.stroke();
  // hondo del plato: borde interior sombreado
  const ri = R * .55;
  rr(c, g.borde - s * .008, g.borde - s * .004, g.interior + s * .016, g.interior + s * .016, ri * 1.08);
  c.fillStyle = '#C9D6E6'; c.fill();
  // caldo dorado
  const caldo = c.createRadialGradient(s * .45, s * .4, s * .05, s / 2, s / 2, s * .62);
  caldo.addColorStop(0, '#F5BC55'); caldo.addColorStop(.55, '#E99E37'); caldo.addColorStop(1, '#D07C22');
  rr(c, g.borde, g.borde, g.interior, g.interior, ri); c.fillStyle = caldo; c.fill();
  // borde del caldo más oscuro (profundidad)
  c.save(); rr(c, g.borde, g.borde, g.interior, g.interior, ri); c.clip();
  c.lineWidth = s * .03; c.strokeStyle = 'rgba(176,104,24,.35)'; rr(c, g.borde, g.borde, g.interior, g.interior, ri); c.stroke();
  // gotitas de grasa y perejil (muy tenues para no estorbar la lectura)
  const rnd = mulberry32(5);
  for (let i = 0; i < 70; i++) { const x = g.borde + rnd() * g.interior, y = g.borde + rnd() * g.interior, r = s * (.004 + rnd() * .01);
    c.fillStyle = 'rgba(255,246,210,.45)'; c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill();
    c.strokeStyle = 'rgba(200,130,40,.25)'; c.lineWidth = 1; c.stroke(); }

  const pl = L.plato;
  for (let i = 0; i < 3; i++) for (let j = 0; j < 7; j++) { const u = ((tAhora * .22 + i * .33 + j * .045) % 1);
    const x = pl.x + pl.s * (.3 + i * .2) + Math.sin(u * 7 + i * 2) * 26, y = pl.y + pl.s * .08 - u * 170, s = 46 + u * 70;
    ctx.globalAlpha = Math.sin(u * Math.PI) * .32; ctx.drawImage(H_.brillo, x - s / 2, y - s / 2, s, s); }
  ctx.globalAlpha = 1;
  if (demo) { burbujitasCaldo(demo, L.plato); dibujarPlato(pl, H_.platoInicio, H_.letrasInicio, demo, { demo: true, aparicion: clamp(te / .6, 0, 1) }); }
  // título
  const t = L.titulo, kt = easeBack((te - .1) / .5);
  if (kt > 0) { ctx.save(); ctx.translate(t.x, t.y); ctx.scale(kt, kt); ctx.rotate(Math.sin(tAhora * 1.4) * .012);
    if (O === 'v') texto('SOPA DE LETRAS', 0, 0, { fs: t.fs, color: C.rojo, borde: 18, colorBorde: '#FFFFFF', sombra: 'rgba(0,40,110,.35)', max: 1000 });
    else { texto('SOPA DE', 0, -t.fs * .52, { fs: t.fs, color: C.rojo, borde: 18, colorBorde: '#FFFFFF', sombra: 'rgba(0,40,110,.35)' });
      texto('LETRAS', 0, t.fs * .52, { fs: t.fs, color: C.rojo, borde: 18, colorBorde: '#FFFFFF', sombra: 'rgba(0,40,110,.35)' }); }
    ctx.restore(); }
  const s = L.sub, ks = clamp((te - .35) / .4, 0, 1);
  if (ks > 0) { ctx.save(); ctx.globalAlpha = ks;
    const lineas = O === 'v' ? ['Desliza el dedo sobre las letras y encuentra', 'las 6 palabras. Tienes 1 minuto y 3 oportunidades.']
      : ['Desliza el dedo sobre las letras', 'y encuentra las 6 palabras.', 'Tienes 1 minuto', 'y 3 oportunidades.'];
    lineas.forEach((ln, i) => texto(ln, s.x, s.y + i * s.lh, { fs: s.fs, peso: 600, color: C.tinta, borde: 10, colorBorde: 'rgba(255,255,255,.9)', max: O === 'v' ? 1020 : 560 }));
    ctx.restore(); }
  const b = L.boton; boton('jugar', b.x, b.y, b.w, b.h, 'JUGAR', empezar, true, (te - .5) / .5);
  if (tAhora - ultimaActividad > INACTIVIDAD && te > INACTIVIDAD) { ultimaActividad = tAhora; irAInicio(); }
}
function burbujitasCaldo(m, pl) {
  m.burbujitas = m.burbujitas || []; m.proxB = m.proxB ?? tAhora + .5;
  if (tAhora > m.proxB) { const g = geometriaPlato(pl); m.proxB = tAhora + .5 + Math.random() * 1.1;
    const r = 1 + Math.floor(Math.random() * (N - 1)), c = 1 + Math.floor(Math.random() * (N - 1));
    m.burbujitas.push({ x: g.gx + c * g.celda, y: g.gy + r * g.celda, t0: tAhora }); if (m.burbujitas.length > 6) m.burbujitas.shift(); }
}
function pantallaJuego(dt) {
  const L = LY.juego, te = tAhora - tEstado;
  dibujarMarca(L); dibujarBebe(L.bebe, estado === 'resultado' && motivoFin !== 'victoria' ? 'triste' : null);
  if (O === 'h' && L.titulo) { texto('SOPA DE', L.titulo.x, L.titulo.y, { fs: L.titulo.fs, color: C.rojo, borde: 12, colorBorde: '#FFFFFF', sombra: 'rgba(0,40,110,.3)' });
    texto('LETRAS', L.titulo.x, L.titulo.y + L.titulo.fs * 1.02, { fs: L.titulo.fs, color: C.rojo, borde: 12, colorBorde: '#FFFFFF', sombra: 'rgba(0,40,110,.3)' }); }
  const ent = estado === 'entrada' ? te : null;
  burbujitasCaldo(partida, L.plato);
  dibujarPlato(L.plato, H_.platoJuego, H_.letrasJuego, partida, { juego: true, sacude: true, aparicion: ent != null ? clamp(te / .45, 0, 1) : 1, entrada: ent != null ? te - .15 : null });
  dibujarReloj(ent); dibujarVidas(ent); dibujarLista(ent);
}
function dibujarTextos() {
  for (let i = textos.length - 1; i >= 0; i--) { const t = textos[i], k = (tAhora - t.t0) / 1.1; if (k > 1) { textos.splice(i, 1); continue; }
    ctx.save(); ctx.globalAlpha = k < .7 ? 1 : (1 - k) / .3; ctx.translate(t.x, t.y - easeOut(k) * 70); const e = easeBack(k / .25); ctx.scale(e, e);
    texto(t.s, 0, 0, { fs: t.fs, color: t.color, borde: 14, colorBorde: '#FFFFFF', sombra: 'rgba(0,30,90,.3)' }); ctx.restore(); }
  if (cartel) { const k = (tAhora - cartel.t0) / cartel.dur; if (k > 1) { cartel = null; return; } if (k < 0) return;
    const e = k < .2 ? easeBack(k / .2) : 1, a = k > .85 ? (1 - k) / .15 : 1;
    ctx.save(); ctx.globalAlpha = a; ctx.translate(cartel.x, cartel.y); ctx.rotate(-.04); ctx.scale(e, e);
    texto(cartel.s, 0, 0, { fs: cartel.fs || 104, color: cartel.color, borde: 22, colorBorde: '#FFFFFF', sombra: 'rgba(0,30,90,.35)', max: (O === 'v' ? 980 : 940) }); ctx.restore(); }
}
function pantallaResultado() {
  const P = LY.panel, te = tAhora - tEstado, gano = motivoFin === 'victoria';
  ctx.fillStyle = `rgba(0,40,110,${.38 * clamp(te / .4, 0, 1)})`; ctx.fillRect(0, 0, W, H);
  // la marca y el bebé quedan por encima del velo: el logo nunca cambia de color (D-022)
  dibujarMarca(LY.juego); dibujarBebe(LY.juego.bebe, gano ? null : 'triste');
  const k = easeBack(te / .5); if (k <= 0) return;
  ctx.save(); ctx.translate(P.x + P.w / 2, P.y + P.h / 2); ctx.scale(k, k); ctx.translate(-P.w / 2, -P.h / 2);
  rr(ctx, 0, 18, P.w, P.h, 60); ctx.fillStyle = 'rgba(0,25,80,.3)'; ctx.fill();
  rr(ctx, 0, 0, P.w, P.h, 60); ctx.fillStyle = '#FFFFFF'; ctx.fill(); ctx.lineWidth = 10; ctx.strokeStyle = C.azul; ctx.stroke();
  rr(ctx, 18, 18, P.w - 36, P.h - 36, 46); ctx.lineWidth = 4; ctx.strokeStyle = C.rojo; ctx.stroke();
  // cielo pequeño arriba del panel
  ctx.save(); rr(ctx, 30, 30, P.w - 60, P.h * .26, 40); ctx.clip(); const cg = ctx.createLinearGradient(0, 30, 0, 30 + P.h * .26);
  cg.addColorStop(0, '#5BB8F0'); cg.addColorStop(1, '#CDEEFC'); ctx.fillStyle = cg; ctx.fillRect(30, 30, P.w - 60, P.h * .26);
  ctx.globalAlpha = .9; ctx.drawImage(H_.nube, 40 + Math.sin(tAhora * .3) * 20, 60, H_.nubeW * .45, H_.nubeH * .45); ctx.drawImage(H_.nube, P.w - 260 - Math.sin(tAhora * .25) * 20, 110, H_.nubeW * .55, H_.nubeH * .55);
  ctx.globalAlpha = 1; ctx.restore();
  const encontradas = partida.palabras.filter(w => w.encontradaEn >= 0).length;
  const titulo = gano ? '¡Lo lograste!' : '¡Casi lo logras!';
  const kt = easeBack((te - .25) / .45);
  ctx.save(); ctx.translate(P.w / 2, 30 + P.h * .13); ctx.scale(kt, kt); ctx.rotate(Math.sin(tAhora * 2) * .015);
  texto(titulo, 0, 0, { fs: O === 'v' ? 112 : 104, color: gano ? C.rojo : C.azul, borde: 20, colorBorde: '#FFFFFF', sombra: 'rgba(0,30,90,.3)', max: P.w - 120 }); ctx.restore();
  const usado = TIEMPO - Math.max(0, tiempoRestante), mm = Math.floor(usado / 60), ss = String(Math.round(usado % 60)).padStart(2, '0');
  const l1 = gano ? `Encontraste las 6 palabras en ${mm}:${ss}.` : (motivoFin === 'tiempo' ? 'Se acabó el tiempo.' : 'Se acabaron las 3 oportunidades.');
  const l2 = gano ? '¡Qué buena vista tienes!' : `Encontraste ${encontradas} de 6 palabras. ¡Inténtalo otra vez!`;
  const y0 = 30 + P.h * .26 + 70;
  texto(l1, P.w / 2, y0, { fs: 48, color: C.tinta, max: P.w - 120 });
  texto(l2, P.w / 2, y0 + 66, { fs: 42, peso: 600, color: gano ? C.rojo : C.tinta, max: P.w - 120 });
  // las 6 palabras, encontradas con su color y las que faltaban en blanco
  const cols = 2, cw = (P.w - 140 - 24) / cols, ch = 66, yy = y0 + 140;
  partida.palabras.forEach((w, i) => { const c = i % cols, f = Math.floor(i / cols), x = 70 + c * (cw + 24), y = yy + f * (ch + 16);
    const kk = easeBack((te - .5 - i * .08) / .35); if (kk <= 0) return;
    ctx.save(); ctx.translate(x + cw / 2, y + ch / 2); ctx.scale(kk, kk); ctx.translate(-cw / 2, -ch / 2);
    const ok = w.encontradaEn >= 0; rr(ctx, 0, 0, cw, ch, ch / 2); ctx.fillStyle = ok ? w.color : '#F1F5FB'; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = ok ? '#FFFFFF' : C.gris; ctx.stroke();
    texto(w.palabra, cw / 2, ch / 2 + 1, { fs: 36, peso: 600, color: ok ? '#FFFFFF' : '#5A6E8C', max: cw - 40 }); ctx.restore(); });
  ctx.restore();
  const bw = O === 'v' ? 600 : 560, bh = 150, bx = P.x + (P.w - bw) / 2, by = P.y + P.h - bh - 64;
  boton('otra', bx, by, bw, bh, 'JUGAR DE NUEVO', () => { if (tAhora - tEstado > GUARDA_RESULTADO) empezar(); }, te > GUARDA_RESULTADO, (te - .7) / .45);
  if (tAhora - ultimaActividad > INACTIVIDAD && te > INACTIVIDAD) irAInicio();
}

/* ======================= Bucle ======================= */
let tPrevio = 0;
function actualizar(dt) {
  if (estado === 'entrada' && tAhora - tEstado >= ENTRADA) { cambiarEstado('juego'); SFX.ya();
    const pl = LY.juego.plato; cartel = { s: '¡A jugar!', t0: tAhora, dur: 1.0, color: C.rojo, x: pl.x + pl.s / 2, y: pl.y + pl.s / 2, fs: 120 }; }
  if (estado === 'juego') {
    tiempoRestante -= dt;
    const s = Math.ceil(tiempoRestante);
    if (tiempoRestante <= 10 && s !== ultimoTic && s > 0) { ultimoTic = s; SFX.tic(s <= 3); }
    if (tiempoRestante <= 0) { tiempoRestante = 0; terminar('tiempo'); }
  }
  if (estado === 'fin') {
    // en la derrota se muestran, una por una, las palabras que faltaban
    if (motivoFin !== 'victoria') partida.palabras.filter(w => w.encontradaEn < 0).forEach((w, i) => { if (w.mostrar === undefined && tAhora - tEstado > .5 + i * .3) { w.mostrar = tAhora; SFX.burbuja(); } });
    if (motivoFin === 'victoria' && Math.random() < dt * 3) confeti(6);
    if (tAhora - tEstado > (motivoFin === 'victoria' ? 2.3 : 2.6)) { cambiarEstado('resultado'); ultimaActividad = tAhora; }
  }
  if (estado === 'resultado' && festejo && Math.random() < dt * 2) confeti(4);
  actualizarParticulas(dt);
}
function dibujar(dt) {
  ctx.setTransform(px, 0, 0, px, 0, 0);
  dibujarFondo(dt);
  botones.forEach(b => b.activo = false);
  if (estado === 'inicio') pantallaInicio(dt);
  else if (partida) { pantallaJuego(dt); if (estado === 'resultado') pantallaResultado(); }
  dibujarParticulas(); dibujarTextos();
}
function cuadro(ms) {
  const t = ms / 1000, dt = Math.min(.05, Math.max(0, t - tPrevio)); tPrevio = t; tAhora = t;
  if (estado !== 'carga') { actualizar(dt); dibujar(dt); }
  requestAnimationFrame(cuadro);
}

/* ======================= Escala por escenario fijo ======================= */
function ajustar() {
  const o = orientacionDeseada(); const cambio = o !== O || !H_.fondo;
  O = o; LY = LAYOUTS[O]; W = LY.W; H = LY.H;
  escala = Math.min(innerWidth / W, innerHeight / H);
  const dpr = window.devicePixelRatio || 1; const nuevoPx = Math.min(escala * dpr, 3840 / Math.max(W, H));
  lienzo.style.width = W * escala + 'px'; lienzo.style.height = H * escala + 'px';
  lienzo.style.left = (innerWidth - W * escala) / 2 + 'px'; lienzo.style.top = (innerHeight - H * escala) / 2 + 'px';
  lienzo.width = Math.round(W * nuevoPx); lienzo.height = Math.round(H * nuevoPx);
  if (cambio || Math.abs(nuevoPx - px) > .01) { px = nuevoPx; hornearTodo(); prepararNubes(); }
}
let reajuste = 0; addEventListener('resize', () => { clearTimeout(reajuste); reajuste = setTimeout(ajustar, 120); });
document.addEventListener('visibilitychange', () => { if (!AC) return; if (document.hidden) AC.suspend(); else AC.resume(); });

/* ======================= Ayudas para revisar la maqueta ======================= */
window.sopa = {
  encontrar() { if (estado !== 'juego') return; const w = partida.palabras.find(p => p.encontradaEn < 0); if (w) encontrada(w); },
  fallar() { if (estado !== 'juego') return; fallo({ r0: 0, c0: 0, dr: 0, dc: 1, n: 3 }, [[0, 0], [0, 1], [0, 2]]); },
  ganar() { while (estado === 'juego') this.encontrar(); },
  perder(m = 'tiempo') { if (estado !== 'juego') return; if (m === 'tiempo') tiempoRestante = .01; else { errores = ERRORES_MAX - 1; this.fallar(); } },
  tiempo(s) { tiempoRestante = s; },
  // deja dibujada una selección a medio camino sobre la palabra i (para capturas)
  seleccionar(i = 1, fraccion = .6) { const w = partida.palabras[i], n = Math.max(2, Math.round(w.celdas.length * fraccion));
    const [r0, c0] = w.celdas[0], [r1, c1] = w.celdas[1]; sel = { r0, c0, dr: r1 - r0, dc: c1 - c0, n, id: -1, t0: tAhora, cambio: tAhora - 1 }; },
  empezar, irAInicio, estado: () => estado, partida: () => partida,
  audio: () => ({ contexto: AC ? AC.state : 'sin iniciar', muestras: Object.keys(MUESTRAS), musica: mus.on ? (mus.src ? 'archivo' : 'sintetizada') : 'apagada' }),
  verificar(n = 500) { const rnd = mulberry32(12345); let malas = 0; for (let i = 0; i < n; i++) { const r = generar(rnd);
    for (const p of r.puestas) { if (contarApariciones(r.g, p.palabra) !== 1) malas++;
      const [a, b] = p.celdas, d = [b[0] - a[0], b[1] - a[1]]; if (!DIRS.some(x => x[0] === d[0] && x[1] === d[1])) malas++; } } return malas; },
};
if (PARAMS.get('depurar') === '1') addEventListener('keydown', e => { const k = e.key.toLowerCase();
  if (k === '1') sopa.encontrar(); if (k === 'e') sopa.fallar(); if (k === 'g') sopa.ganar(); if (k === 'p') sopa.perder(); if (k === 't') sopa.tiempo(12); });

/* ======================= Arranque ======================= */
async function arrancar() {
  ajustar();
  const fuentes = Promise.all([document.fonts.load(FUENTE(700, 50)), document.fonts.load(FUENTE(600, 50))]).catch(() => {});
  await Promise.race([Promise.all([fuentes, ...Object.keys(IMGS).map(cargarImagen)]), new Promise(r => setTimeout(r, 4000))]);

  irAInicio(); ultimaActividad = tAhora;
}
requestAnimationFrame(cuadro);
arrancar();
})();
