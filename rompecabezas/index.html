<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Rompecabezas Baby Finger</title>
<!--
  Maqueta del rompecabezas de Baby Finger (sprint B5), cuarta dinámica de la marca, en un ambiente propio «en la
  playa» que une el cielo del parque con el agua del mar. Solo sirve para aprobar aspecto, sonido y sensación antes
  de construirlo en libGDX.

  Igual que la sopa y las memorias: todo se dibuja en un solo lienzo con lo que tiene libGDX (imágenes o recortes de
  imagen, formas llenas, líneas, curvas, texto con borde, transparencia, giro y escala). La lámina (imagen sobre su
  fondo), cada pieza recortada, su relieve y su sombra se "hornean" una vez por partida en imágenes aparte (en nativo,
  texturas hechas con un Pixmap y una máscara); en cada cuadro solo se pegan, se giran y se escalan.
  La forma de las piezas sigue la curva del generador de Draradech (CC0). Las reglas están en logica.js
  (se prueban con node pruebas.mjs).

  Parámetros: ?o=v o ?o=h fuerzan la orientación, ?semilla=123 repite las partidas, ?imagen=panalG (u otra) fija la
  imagen de la primera partida, ?musica=0 quita la música, ?musica=sintetizada usa la base hecha por código,
  ?depurar=1 activa teclas (1 o F coloca una pieza, E error, G gana,
  P pierde por tiempo, R pierde por errores, T deja 12 s, V salta la vista previa).
-->
<style>
@font-face{font-family:'Fredoka';src:url(fuentes/Fredoka-Bold.ttf) format('truetype');font-weight:700;font-display:block}
@font-face{font-family:'Fredoka';src:url(fuentes/Fredoka-SemiBold.ttf) format('truetype');font-weight:600;font-display:block}
html,body{margin:0;height:100%;overflow:hidden;background:#5cc0ee;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#lienzo{position:absolute;display:block;touch-action:none;cursor:pointer}
</style>
</head>
<body>
<canvas id="lienzo"></canvas>
<script src="logica.js"></script>
<script>
'use strict';
(() => {
const PARAMS = new URLSearchParams(location.search);
const EMB = window.__ROMPE_EMB || null;              // en el archivo compartible todo viene incrustado
const recurso = n => (EMB && EMB[n]) ? EMB[n] : n;
const LG = window.RompecabezasLogica;

/* ======================= Reglas y tiempos ======================= */
const PIEZAS = LG.PIEZAS, N = LG.COLS, ERRORES_MAX = LG.ERRORES_MAX, TIEMPO = LG.TIEMPO;
const VISTA = 3, INACTIVIDAD = 45, ABANDONO = 90, GUARDA_RESULTADO = 1.2;
const LADO = 640, LADO_DEMO = 480;                   // tablero de juego y de la demostración (unidades de 1080p)
const FORZADA = LG.IMAGENES.includes(PARAMS.get('imagen')) ? PARAMS.get('imagen') : null;

/* Colores de la marca (los mismos de la sopa y las memorias) */
const C = { rojo: '#DC1C26', rojoOsc: '#A0121A', azul: '#00348A', azulOsc: '#00225C', blanco: '#FFFFFF',
  tinta: '#0B2A66', gris: '#C5D0DF', oro: '#FFC93C', verde: '#22A356' };
const ELOGIOS = ['¡Muy bien!', '¡Genial!', '¡Excelente!', '¡Bien hecho!', '¡Súper!', '¡Eso es!', '¡Perfecto!'];
const SUB = 'en la playa', COLOR_SUB = '#0E86C8';

/* ======================= Azar con semilla ======================= */
let semilla = PARAMS.has('semilla') ? Number(PARAMS.get('semilla')) >>> 0 : (Math.random() * 1e9) >>> 0;
const FIJA = PARAMS.has('semilla');   // con ?semilla las partidas se repiten en el mismo orden
const nuevaSemilla = () => { semilla = (semilla * 1103515245 + 12345 + (FIJA ? 0 : (Math.random() * 1e6) | 0)) >>> 0; return semilla; };
const mulberry32 = LG.mulberry32;

/* ======================= Escenario fijo y orientación ======================= */
const lienzo = document.getElementById('lienzo'), ctx = lienzo.getContext('2d');
let O = 'v', W = 1080, H = 1920, escala = 1, px = 1;      // px: píxeles reales por unidad del escenario
function orientacionDeseada() { const f = PARAMS.get('o'); if (f === 'v' || f === 'h') return f; return innerHeight >= innerWidth ? 'v' : 'h'; }

/* Distribución (unidades de 1080p). Vertical: reloj, vidas, tablero y bandeja arriba; marca y bebé abajo (D-013).
   Horizontal: tablero y bandeja en la parte de abajo, la marca a la izquierda y el título arriba a la derecha (D-014). */
const LAYOUTS = {
  v: { W: 1080, H: 1920, mar: 880, arena: 1440,
    juego: { tablero: { x: 400, y: 182, lado: LADO }, muestra: { x: 40, y: 190, lado: 326 },
      ayuda: { x: 203, y: 612, lh: 46, fs: 34, lineas: ['Arrastra', 'cada pieza', 'a su lugar'] },
      reloj: { x: 40, y: 36, w: 480, h: 116 }, vidas: { x: 540, y: 42, w: 280, h: 104 }, contador: { x: 840, y: 36, w: 200, h: 116 },
      cuenta: { x: 40, y: 34, w: 1000, h: 120 },
      // 16 piezas en 6 columnas y 3 filas (6, 6 y 4): lugares de 159 × 179; a escala 0,61 el cuerpo mide 98 y con
      // pestañas no pasa de 154, así que ninguna tapa a otra
      bandeja: { x: 40, y: 866, w: 1000, h: 584, cols: 6, esc: .61 },
      titulo: { x: 540, y: 1512, fs: 84 }, sub: { y: 1580, fs: 42 },
      bebe: { img: 'bebeSentado', x: 712, y: 1584, w: 336 }, logo: { x: 52, y: 1618, w: 246 }, producto: { x: 338, y: 1704, w: 166 },
      sombrilla: { x: 1004, y: 1536, r: 86 } },
    inicio: { titulo: { x: 540, y: 200, fs: 118 }, sub: { x: 540, y: 300, fs: 58 },
      instr: { x: 540, y: 378, fs: 38, lh: 48, lineas: ['Arrastra cada pieza a su lugar.', 'Antes verás la imagen completa.', 'Tienes 1 minuto y 3 oportunidades.'] },
      demo: { x: 300, y: 540, lado: LADO_DEMO, a: { x: 930, y: 640 }, b: { x: 150, y: 930 } }, boton: { x: 250, y: 1100, w: 580, h: 156 },
      bebe: { img: 'bebeIngeniero', x: 716, y: 1276, h: 620 }, logo: { x: 56, y: 1490, w: 300 }, producto: { x: 392, y: 1620, w: 216 },
      sombrilla: { x: 640, y: 1500, r: 80 } },
    panel: { x: 60, y: 150, w: 960, h: 1180 } },
  h: { W: 1920, H: 1080, mar: 470, arena: 830,
    juego: { tablero: { x: 456, y: 404, lado: LADO }, muestra: { x: 456, y: 44, lado: 270 },
      reloj: { x: 752, y: 40, w: 344, h: 110 }, vidas: { x: 752, y: 162, w: 344, h: 96 }, contador: { x: 752, y: 272, w: 344, h: 84 },
      cuenta: { x: 752, y: 38, w: 344, h: 318 },
      // 16 piezas en 4 columnas y 4 filas: lugares de 181 × 190; a escala 0,7 el cuerpo mide 112 y con pestañas 177
      bandeja: { x: 1124, y: 236, w: 770, h: 808, cols: 4, esc: .7 },
      titulo: { x: 1509, y: 98, fs: 80 }, sub: { x: 1509, y: 180, fs: 42 },
      bebe: { img: 'bebeSentado', x: 34, y: 680, w: 380 }, logo: { x: 80, y: 40, w: 250 }, producto: { x: 146, y: 400, w: 166 } },
    inicio: { titulo: { x: 1588, y: 196, fs: 118 }, sub: { x: 1588, y: 300, fs: 58 },
      instr: { x: 1588, y: 384, fs: 38, lh: 50, lineas: ['Arrastra cada pieza', 'a su lugar.', 'Antes verás la imagen.', 'Tienes 1 minuto y', '3 oportunidades.'] },
      demo: { x: 600, y: 270, lado: LADO_DEMO, a: { x: 1190, y: 380 }, b: { x: 520, y: 840 } }, boton: { x: 1338, y: 790, w: 500, h: 156 },
      bebe: { img: 'bebeIngeniero', x: 96, y: 420, h: 640 }, logo: { x: 76, y: 36, w: 250 }, producto: { x: 880, y: 866, w: 150 },
      sombrilla: { x: 1870, y: 1012, r: 64 } },
    panel: { x: 420, y: 50, w: 1080, h: 980 } },
};
let LY = LAYOUTS.v;
const centro = r => ({ x: r.x + r.w / 2, y: r.y + r.h / 2 });

/* ======================= Recursos ======================= */
const IMGS = { logo: 'img/logo.png', bebeSentado: 'img/bebe-sentado.png', bebeIngeniero: 'img/bebe-ingeniero.png',
  panalPants: 'img/panal-pants.png', panalG: 'img/panal-g.png', panalAcuatico: 'img/panal-acuatico.png',
  toallitaAzul: 'img/toallita-azul.png', toallitaBlanca: 'img/toallita-blanca.png', toallitaRosa: 'img/toallita-rosa.png' };
/* En la lámina los bebés van recortados a lo que se ve (en nativo, un TextureRegion); los productos van completos.
   Medidas en píxeles de cada PNG (las mismas de la memoria). */
const REGION = { bebeSentado: [135, 34, 799, 881], bebeIngeniero: [71, 86, 582, 1245] };
const IM = {};
function cargarImagen(k) { return new Promise(ok => { const im = new Image(); im.onload = () => { IM[k] = im; ok(); }; im.onerror = () => ok(); im.src = recurso(IMGS[k]); }); }
// dibuja una imagen con su proporción original: se da el ancho o el alto, nunca los dos
function imagen(k, x, y, w, h) { const im = IM[k]; if (!im) return; const a = im.naturalWidth / im.naturalHeight;
  if (w == null) w = h * a; else h = w / a; ctx.drawImage(im, x, y, w, h); return { w, h }; }

/* ======================= Utilidades de dibujo ======================= */
const lerp = (a, b, k) => a + (b - a) * k, clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const easeOut = k => 1 - Math.pow(1 - clamp(k, 0, 1), 3);
const easeIn = k => Math.pow(clamp(k, 0, 1), 3);
const easeInOut = k => { k = clamp(k, 0, 1); return k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2; };
const easeBack = k => { k = clamp(k, 0, 1); const s = 1.70158; return 1 + (s + 1) * Math.pow(k - 1, 3) + s * Math.pow(k - 1, 2); };
const FUENTE = (peso, tam) => `${peso} ${tam}px Fredoka, "Arial Rounded MT Bold", "Trebuchet MS", sans-serif`;
function rr(c, x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
function texto(s, x, y, o) {
  ctx.save(); ctx.font = FUENTE(o.peso || 700, o.fs);
  let k = o.k || 1; if (o.max) { const w = ctx.measureText(s).width; if (w * k > o.max) k = o.max / w; }
  ctx.translate(x, y); if (k !== 1) ctx.scale(k, k);
  ctx.textAlign = o.al || 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  if (o.sombra) { ctx.fillStyle = o.sombra; if (o.borde) { ctx.lineWidth = o.borde; ctx.strokeStyle = o.sombra; ctx.strokeText(s, 0, o.fs * .08); } ctx.fillText(s, 0, o.fs * .08); }
  if (o.borde) { ctx.lineWidth = o.borde; ctx.strokeStyle = o.colorBorde || C.blanco; ctx.strokeText(s, 0, 0); }
  ctx.fillStyle = o.color || C.tinta; ctx.fillText(s, 0, 0); ctx.restore();
}
function lienzoAparte(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h)); return c; }
function corazon(c, cx, cy, s) { // corazón de lado s, centrado
  c.beginPath(); c.moveTo(cx, cy + s * .38);
  c.bezierCurveTo(cx - s * .62, cy - s * .02, cx - s * .42, cy - s * .52, cx, cy - s * .22);
  c.bezierCurveTo(cx + s * .42, cy - s * .52, cx + s * .62, cy - s * .02, cx, cy + s * .38); c.closePath(); }
function estrella4(c, x, y, r) { c.beginPath(); for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4, q = i % 2 ? r * .28 : r; c.lineTo(x + Math.cos(a) * q, y + Math.sin(a) * q); } c.closePath(); }
function estrella5(c, x, y, r, rot = 0) { c.beginPath(); for (let i = 0; i < 10; i++) { const a = rot - Math.PI / 2 + i * Math.PI / 5, q = i % 2 ? r * .48 : r; c.lineTo(x + Math.cos(a) * q, y + Math.sin(a) * q); } c.closePath(); }
function concha(c, x, y, s) { c.fillStyle = '#FFE3EE'; c.beginPath(); c.moveTo(x, y + s * .5); for (let k = 0; k <= 8; k++) { const a = Math.PI + k * Math.PI / 8; c.lineTo(x + Math.cos(a) * s, y + Math.sin(a) * s * .9); } c.closePath(); c.fill();
  c.strokeStyle = 'rgba(200,120,150,.6)'; c.lineWidth = Math.max(1.5, s * .1); for (let k = 1; k < 8; k++) { const a = Math.PI + k * Math.PI / 8; c.beginPath(); c.moveTo(x, y + s * .5); c.lineTo(x + Math.cos(a) * s * .9, y + Math.sin(a) * s * .8); c.stroke(); } }
function nubecita(c, x, y, k) { [[0, 0, 26], [28, -14, 32], [58, 0, 24], [30, 8, 26]].forEach(([dx, dy, r]) => { c.beginPath(); c.arc(x + dx * k, y + dy * k, r * k, 0, 6.29); c.fill(); }); }
function visto(c, x, y, s, color) { // círculo con el visto de pieza o imagen completa
  c.fillStyle = 'rgba(0,40,20,.25)'; c.beginPath(); c.arc(x, y + s * .08, s, 0, 6.29); c.fill();
  c.fillStyle = color || C.verde; c.beginPath(); c.arc(x, y, s, 0, 6.29); c.fill(); c.lineWidth = s * .16; c.strokeStyle = '#FFFFFF'; c.stroke();
  c.lineCap = 'round'; c.lineJoin = 'round'; c.lineWidth = s * .24; c.beginPath(); c.moveTo(x - s * .42, y + s * .02); c.lineTo(x - s * .1, y + s * .34); c.lineTo(x + s * .46, y - s * .3); c.stroke(); }

/* ======================= Forma de las piezas =======================
   Cada borde interior es la curva del generador de Draradech (CC0): tres curvas de Bézier cúbicas por lado, con la
   pestaña del 20 % y una pequeña variación por borde (sale de logica.js). Los bordes del contorno son rectos.
   Se trazan en coordenadas del tablero; una misma curva sirve a las dos piezas que la comparten (una la recorre al
   revés), así encajan exacto. */
function puntosBorde(e, x0, y0, cel, horizontal) {
  const t = LG.PESTANA, b = e.b, cc = e.c, d = e.d, s = e.signo;
  const ls = [0, .2, .5 + b + d, .5 - t + b, .5 - 2 * t + b - d, .5 + 2 * t + b - d, .5 + t + b, .5 + b + d, .8, 1];
  const ws = [0, 0, -t + cc, t + cc, 3 * t + cc, 3 * t + cc, t + cc, -t + cc, 0, 0];
  return ls.map((l, k) => horizontal ? [x0 + l * cel, y0 + ws[k] * cel * s] : [x0 + ws[k] * cel * s, y0 + l * cel]);
}
function curvas(c, P, reves) { const Q = reves ? P.slice().reverse() : P;
  for (let k = 1; k < 10; k += 3) c.bezierCurveTo(Q[k][0], Q[k][1], Q[k + 1][0], Q[k + 1][1], Q[k + 2][0], Q[k + 2][1]); }
function trazarPieza(c, cortes, i, cel) {
  const f = Math.floor(i / N), k = i % N, x0 = k * cel, y0 = f * cel, x1 = x0 + cel, y1 = y0 + cel;
  c.beginPath(); c.moveTo(x0, y0);
  if (f === 0) c.lineTo(x1, y0); else curvas(c, puntosBorde(cortes.h[f - 1][k], x0, y0, cel, true), false);
  if (k === N - 1) c.lineTo(x1, y1); else curvas(c, puntosBorde(cortes.v[f][k], x1, y0, cel, false), false);
  if (f === N - 1) c.lineTo(x0, y1); else curvas(c, puntosBorde(cortes.h[f][k], x0, y1, cel, true), true);
  if (k === 0) c.lineTo(x0, y0); else curvas(c, puntosBorde(cortes.v[f][k - 1], x0, y0, cel, false), true);
  c.closePath();
}

/* ======================= Imágenes horneadas (en nativo: texturas) ======================= */
const H_ = {};
let pxP = 1;                              // resolución de la lámina y las piezas horneadas
function hornearTodo() {
  pxP = Math.min(px, 1.6);
  hornearFondo(); hornearNube(); hornearBrillo(); hornearHalo(); hornearFranja(); hornearToalla();
  if (demo) demo.set = hornearSet(demo.imagen, demo.cortes, LADO_DEMO, false);
  if (partida) J = hornearSet(partida.imagen, partida.cortes, LADO, true);
}
function hornearFondo() {     // la playa: el cielo del parque y el agua del mar, con arena
  const cv = lienzoAparte(W * px, H * px), c = cv.getContext('2d'); c.scale(px, px);
  const mar = LY.mar, arena = LY.arena, rnd = mulberry32(51);
  const cielo = c.createLinearGradient(0, 0, 0, mar);
  cielo.addColorStop(0, '#3AA6EA'); cielo.addColorStop(.6, '#7FCBF4'); cielo.addColorStop(1, '#D4F0FC');
  c.fillStyle = cielo; c.fillRect(0, 0, W, H);
  const sol = c.createRadialGradient(W * .86, H * .05, 0, W * .86, H * .05, W * .5);
  sol.addColorStop(0, 'rgba(255,255,235,.6)'); sol.addColorStop(1, 'rgba(255,255,235,0)'); c.fillStyle = sol; c.fillRect(0, 0, W, mar);
  // mar con su luz
  const agua = c.createLinearGradient(0, mar, 0, arena);
  agua.addColorStop(0, '#5FD0F2'); agua.addColorStop(.45, '#2FA8E0'); agua.addColorStop(1, '#1987CC');
  c.fillStyle = agua; c.fillRect(0, mar, W, arena - mar + 40);
  c.fillStyle = 'rgba(255,255,255,.55)'; c.fillRect(0, mar - 2, W, 4);
  // isla lejana con dos palmeras pequeñas
  const ix = O === 'v' ? W * .2 : W * .1, iy = mar;
  c.fillStyle = '#7CC456'; c.beginPath(); c.ellipse(ix, iy, 110, 26, 0, Math.PI, 0); c.fill();
  c.strokeStyle = '#8A5A2B'; c.lineWidth = 6; c.lineCap = 'round';
  [[ix - 20, 1], [ix + 26, -1]].forEach(([x, d]) => { c.beginPath(); c.moveTo(x, iy - 18); c.quadraticCurveTo(x + d * 6, iy - 50, x + d * 12, iy - 76); c.stroke();
    c.fillStyle = '#3E9630'; for (let k = 0; k < 5; k++) { const a = -Math.PI / 2 + (k - 2) * .62; c.beginPath(); c.ellipse(x + d * 12 + Math.cos(a) * 20, iy - 76 + Math.sin(a) * 12 + 6, 24, 7, a, 0, 6.29); c.fill(); } });
  // reflejos fijos sobre el agua
  c.strokeStyle = 'rgba(255,255,255,.25)'; c.lineWidth = 3;
  for (let i = 0; i < 40; i++) { const x = rnd() * W, y = mar + 20 + rnd() * (arena - mar - 20), w = 20 + rnd() * 40; c.beginPath(); c.moveTo(x, y); c.lineTo(x + w, y); c.stroke(); }
  // arena con la orilla
  c.beginPath(); c.moveTo(0, H); c.lineTo(0, arena + 16);
  for (let i = 0; i < 4; i++) { const x0 = W * i / 4, x1 = W * (i + 1) / 4; c.quadraticCurveTo((x0 + x1) / 2, arena - 22 + (i % 2) * 34, x1, arena + 10); }
  c.lineTo(W, H); c.closePath();
  const ar = c.createLinearGradient(0, arena - 30, 0, H); ar.addColorStop(0, '#F8E3AE'); ar.addColorStop(1, '#E2BC74'); c.fillStyle = ar; c.fill();
  c.strokeStyle = 'rgba(255,255,255,.9)'; c.lineWidth = 8; c.beginPath(); c.moveTo(0, arena + 16);
  for (let i = 0; i < 4; i++) { const x0 = W * i / 4, x1 = W * (i + 1) / 4; c.quadraticCurveTo((x0 + x1) / 2, arena - 22 + (i % 2) * 34, x1, arena + 10); } c.stroke();
  for (let i = 0; i < 80; i++) { const x = rnd() * W, y = arena + 40 + rnd() * (H - arena - 50); c.fillStyle = rnd() < .5 ? 'rgba(160,120,60,.3)' : 'rgba(255,255,255,.55)';
    c.beginPath(); c.ellipse(x, y, 3 + rnd() * 5, 2 + rnd() * 3, 0, 0, 6.29); c.fill(); }
  for (let i = 0; i < (O === 'v' ? 6 : 7); i++) { const x = 40 + rnd() * (W - 80), y = arena + 60 + rnd() * (H - arena - 100), s = 16 + rnd() * 12;
    if (i % 2) { c.fillStyle = '#FF8A5B'; estrella5(c, x, y, s, rnd()); c.fill(); c.fillStyle = 'rgba(255,255,255,.6)'; c.beginPath(); c.arc(x, y, s * .15, 0, 6.29); c.fill(); }
    else concha(c, x, y, s); }
  H_.fondo = cv;
}
function hornearNube() {
  const w = 420, h = 200, cv = lienzoAparte(w * px, h * px), c = cv.getContext('2d'); c.scale(px, px);
  const bolas = [[110, 130, 70], [190, 95, 88], [285, 120, 72], [345, 145, 50], [70, 150, 45], [230, 150, 70]];
  c.fillStyle = 'rgba(160,200,235,.55)'; bolas.forEach(([x, y, r]) => { c.beginPath(); c.arc(x, y + 10, r, 0, Math.PI * 2); c.fill(); });
  c.fillStyle = '#FFFFFF'; bolas.forEach(([x, y, r]) => { c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill(); });
  H_.nube = cv; H_.nubeW = w; H_.nubeH = h;
}
function hornearBrillo() { // mancha de luz suave
  const s = 128, cv = lienzoAparte(s, s), c = cv.getContext('2d'), g = c.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
  g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(.45, 'rgba(255,255,255,.45)'); g.addColorStop(1, 'rgba(255,255,255,0)');
  c.fillStyle = g; c.fillRect(0, 0, s, s); H_.brillo = cv;
}

    const dp = tAhora - (demo.pop[i] ?? -9), esc = (puesta && !sale ? (dp < .4 ? 1 + Math.sin(dp / .4 * Math.PI) * .07 : 1) : tomando ? 1.05 : .85) ;
    dibujarPieza(S, i, x, y, esc, puesta && !sale ? 0 : tomando ? 0 : .08, { relieve: puesta && !sale ? .35 : 1, sombra: !(puesta && !sale), lift: tomando ? 1 : 0,

  const alfa = u < .2 ? u / .2 : u > 3.6 ? clamp(1 - (u - 3.6) / .3, 0, 1) : 1, apretando = P.tomandoA || P.tomandoB;

  ctx.fillStyle = '#FFFFFF'; ctx.strokeStyle = C.azul; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(0, 0, 32, 0, 6.29); ctx.fill(); ctx.stroke();

function pantallaJuego() {
  const L = LY.juego, te = tAhora - tEstado;
  dibujarSombrilla(L.sombrilla); dibujarMarca(L); dibujarBebe(L.bebe, estado === 'resultado' && motivoFin !== 'victoria' ? 'triste' : null);

function dibujarTextos() {

}
// la imagen de la partida en el resultado: armada; si se perdió, las piezas que faltaron quedan pálidas
function dibujarLaminaResultado(x, y, S, gano) {

function pantallaResultado() {
  const P = LY.panel, te = tAhora - tEstado, gano = motivoFin === 'victoria';
  ctx.fillStyle = `rgba(0,40,110,${.38 * clamp(te / .4, 0, 1)})`; ctx.fillRect(0, 0, W, H);

  ctx.drawImage(H_.fondo, (W - sw) / 2 * px, sy * px, sw * px, sh * px, 30, 30, P.w - 60, fh);
  ctx.globalAlpha = .9; ctx.drawImage(H_.nube, 40 + Math.sin(tAhora * .3) * 20, 34, H_.nubeW * .4, H_.nubeH * .4); ctx.drawImage(H_.nube, P.w - 250 - Math.sin(tAhora * .25) * 20, 60, H_.nubeW * .45, H_.nubeH * .45);

  ctx.save(); ctx.translate(P.w / 2, 30 + fh / 2); ctx.scale(kt, kt); ctx.rotate(Math.sin(tAhora * 2) * .015);

  const usado = TIEMPO - partida.tiempo, mm = Math.floor(usado / 60), ss = String(Math.min(59, Math.round(usado % 60))).padStart(2, '0');

/* ======================= Bucle ======================= */
let tPrevio = 0;
function actualizar(dt) {
  correrAgenda();
  if (partida && estado === 'juego') {
    if (LG.avanzar(partida, dt)) terminar('tiempo');
    else { const s = Math.ceil(partida.tiempo); if (partida.tiempo <= 10 && s !== ultimoTic && s > 0) { ultimoTic = s; SFX.tic(s <= 3); } }
  }
  if (estado === 'fin' && motivoFin === 'victoria' && Math.random() < dt * 3) confeti(6);
  if (estado === 'resultado' && festejo && Math.random() < dt * 2) confeti(4);
  // si dejan una partida a medias, vuelve sola al inicio (con el reloj de 60 s casi nunca llega a pasar)
  if (estado === 'juego' && tAhora - ultimaActividad > ABANDONO) irAInicio();
  // sonido de la playa: una ola de vez en cuando y alguna gaviota
  if (tAhora > amb.proxOla) { amb.proxOla = tAhora + 8 + Math.random() * 7; if (estado !== 'fin') SFX.ola(); }
  if (tAhora > amb.proxGaviota) { amb.proxGaviota = tAhora + 14 + Math.random() * 12; if (estado === 'inicio' || estado === 'juego') SFX.gaviota(); }

}
function dibujar(dt) {
  ctx.setTransform(px, 0, 0, px, 0, 0);

  botones.forEach(b => b.activo = false);
  if (estado === 'inicio') pantallaInicio();
  else if (partida) { pantallaJuego(); if (estado === 'resultado') pantallaResultado(); }
  dibujarParticulas(); dibujarTextos();
}
function cuadro(ms) {
  const t = ms / 1000, dt = Math.min(.05, Math.max(0, t - tPrevio)); tPrevio = t; tAhora = t;
  if (estado !== 'carga') { actualizar(dt); dibujar(dt); }
  requestAnimationFrame(cuadro);
}

/* ======================= Escala por escenario fijo ======================= */
function ajustar() {
  const o = orientacionDeseada(); const cambio = o !== O || !H_.fondo;
  O = o; LY = LAYOUTS[O]; W = LY.W; H = LY.H;

  lienzo.style.left = (innerWidth - W * escala) / 2 + 'px'; lienzo.style.top = (innerHeight - H * escala) / 2 + 'px';
  lienzo.width = Math.round(W * nuevoPx); lienzo.height = Math.round(H * nuevoPx);
  if ((cambio || Math.abs(nuevoPx - px) > .01) && estado !== 'carga') {
    px = nuevoPx; hornearTodo(); prepararAmbiente();
    // si giran la pantalla en plena partida, las piezas sueltas vuelven a su lugar de la toalla
    if (cambio && partida && estado === 'juego') { arrastre = null; partida.tomada = -1;
      vis.forEach(v => { if (partida.piezas[v.i].colocada) return; v.anim = null; v.bloqueada = false; v.libre = null; const h = casaDe(v.i); Object.assign(v, { x: h.x, y: h.y, esc: escBandeja(), rot: h.rot }); }); }
  } else px = nuevoPx;
}
let reajuste = 0; addEventListener('resize', () => { clearTimeout(reajuste); reajuste = setTimeout(ajustar, 120); });
document.addEventListener('visibilitychange', () => { if (!AC) return; if (document.hidden) AC.suspend(); else AC.resume(); });

/* ======================= Ayudas para revisar la maqueta ======================= */
const sePuede = () => estado === 'juego' && partida.estado === 'juego' && !arrastre && partida.tomada < 0;
// mueve una pieza sola, como si la llevara un dedo, y la suelta sobre la casilla indicada
function moverSola(i, celda) {

  v.bloqueada = true; animar(v, c.x, c.y, 1.06, 0, .5, { arco: 50, fin: () => { v.bloqueada = false; soltarPieza(i); } }); return true;

const sueltaLibre = () => vis.findIndex(v => !partida.piezas[v.i].colocada && !v.anim && !v.bloqueada);

window.rompecabezas = {

  perderErrores() { if (estado !== 'juego') return; partida.errores = Math.max(partida.errores, ERRORES_MAX - 1); window.rompecabezas.fallar(); },

if (PARAMS.get('depurar') === '1') addEventListener('keydown', e => { const k = e.key.toLowerCase(), m = window.rompecabezas;

/* ======================= Arranque ======================= */
